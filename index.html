$('defis').addEventListener('click', function(ev){
  var b = ev.target.closest ? ev.target.closest('button') : null;
  if (!b) return;
  if (b.hasAttribute('data-dl')){ toggleLevel(S.prefs.dlevels, b.getAttribute('data-dl')); renderDefisHome(); return; }
  if (b.hasAttribute('data-mode')){ startGame(b.getAttribute('data-mode')); return; }
  if (b.id === 'g-quit' || b.id === 'g-home'){ renderDefisHome(); return; }
  if (b.id === 'g-again'){ startGame(GM.k); return; }
  if (b.id === 'g-next'){ GM.i++; if (GM.i >= GM.qs.length) endGame(); else renderQ(); return; }
  if (b.hasAttribute('data-ev')){ openSheet(b.getAttribute('data-ev')); return; }
  if (!GM) return;
  var q = GM.qs[GM.i];
  if (b.id === 'g-hintbtn'){ q.hint = true; $('g-hint').innerHTML = '<span class="big-date">' + cap(fdate(q.e)) + '</span>'; return; }
  if (GM.done || !b.classList.contains('opt') && b.id !== 'g-check') return;

  if (GM.k === 'ordre'){
    if (b.id === 'g-check'){ checkOrder(); return; }
    var ix = parseInt(b.getAttribute('data-i'), 10), pos = q.sel.indexOf(ix);
    if (pos >= 0) q.sel.splice(pos, 1); else q.sel.push(ix);
    var items = $('g-opts').querySelectorAll('.opt');
    for (var i = 0; i < items.length; i++){
      var nEl = items[i].querySelector('.num'), p = q.sel.indexOf(i);
      nEl.textContent = p >= 0 ? (p + 1) : '';
      nEl.className = 'num' + (p >= 0 ? ' on' : '');
    }
    $('g-check').disabled = q.sel.length !== q.items.length;
    return;
  }
  var v = b.getAttribute('data-v');
  if (GM.k === 'avant'){
    var firstE = q.a.y < q.b.y ? q.a : q.b, chosen = v === 'a' ? q.a : q.b, ok = chosen === firstE;
    var bs = $('g-opts').querySelectorAll('.opt');
    for (var j = 0; j < bs.length; j++){
      var e2 = bs[j].getAttribute('data-v') === 'a' ? q.a : q.b;
      var sm = bs[j].querySelector('small'); sm.hidden = false; sm.textContent = cap(fdate(e2));
      if (e2 === firstE) bs[j].classList.add('ok'); else if (bs[j] === b) bs[j].classList.add('ko');
    }
    var other = firstE === q.a ? q.b : q.a;
    var gap = other.y - firstE.y; if (firstE.y < 0 && other.y > 0) gap -= 1;
    feedback(ok, '« ' + esc(firstE.t) + ' » a eu lieu ' + (firstE.a || other.a ? 'environ ' : '') + sp(gap) + ' an' + (gap > 1 ? 's' : '') + ' avant « ' + esc(other.t) + ' ».',
      ok ? null : 'Le plus ancien : ' + firstE.t + ' (' + fdate(firstE) + ')');
    return;
  }
  if (GM.k === 'siecle'){
    var val = parseInt(v, 10), ok2 = val === q.s;
    markOpts(String(q.s), b);
    feedback(ok2, explainCent(q.e.y), ok2 ? null : q.e.t + ' (' + fdate(q.e) + ') : ' + centText(q.e.y));
    return;
  }
  if (GM.k === 'periode'){
    var pr = periodOf(q.e.y), ok3 = v === pr.k;
    markOpts(pr.k, b);
    var ART = {pre:'la ', ant:'l’', moy:'le ', mod:'les ', cont:'l’'};
    feedback(ok3, cap(fdate(q.e)) + ' : c’est ' + ART[pr.k] + pr.name + ' (' + pr.range + ').', ok3 ? null : q.e.t + ' : ' + pr.name);
    return;
  }
  if (GM.k === 'date'){
    var ok4 = parseInt(v, 10) === q.e.y;
    markOpts(String(q.e.y), b);
    feedback(ok4, esc(q.e.t) + ' : ' + fdate(q.e) + ', au ' + centOf(q.e.y) + '.', ok4 ? null : q.e.t + ' : ' + fdate(q.e));
    return;
  }
});
function markOpts(goodV, chosen){
  var bs = $('g-opts').querySelectorAll('.opt');
  for (var i = 0; i < bs.length; i++){
    if (bs[i].getAttribute('data-v') === goodV) bs[i].classList.add('ok');
    else if (bs[i] === chosen) bs[i].classList.add('ko');
  }
}
function checkOrder(){
  var q = GM.qs[GM.i];
  var sorted = q.items.slice().sort(function(a, b){ return a.y - b.y; });
  var good = 0, bs = $('g-opts').querySelectorAll('.opt');
  for (var i = 0; i < q.items.length; i++){
    var p = q.sel.indexOf(i), it = q.items[i];
    var okPos = sorted[p] === it;
    if (okPos) good++;
    bs[i].classList.add(okPos ? 'ok' : 'ko');
    var sm = bs[i].querySelector('small'); sm.hidden = false; sm.textContent = cap(fdate(it));
  }
  $('g-check').hidden = true;
  GM.score += good;
  var list = '<ol>';
  for (var k = 0; k < sorted.length; k++) list += '<li>' + esc(sorted[k].t) + ' (' + fdate(sorted[k]) + ')</li>';
  list += '</ol>';
  feedback(good / 5, '<b>' + (good === 5 ? 'Parfait, tout est dans l’ordre !' : good + ' événement' + (good > 1 ? 's' : '') + ' bien placé' + (good > 1 ? 's' : '') + ' sur 5.') + '</b>' + (good === 5 ? '' : 'L’ordre correct :' + list),
    good === 5 ? null : 'Ordre : ' + sorted.map(function(e){ return e.t + ' (' + fdate(e) + ')'; }).join(' → '));
}
function endGame(){
  var b = S.best[GM.k], rec = false;
  if (!b || GM.score / GM.max > b.s / b.m){ S.best[GM.k] = {s:GM.score, m:GM.max}; rec = !!b || GM.score > 0; save(); }
  var pct = GM.score / GM.max;
  var word = pct === 1 ? 'Sans faute !' : (pct >= 0.7 ? 'Très bien !' : (pct >= 0.4 ? 'Pas mal, continue !' : 'Il faut revoir un peu la frise.'));
  var h = '<div class="game"><div class="g-head"><h2>' + GM.m.name + '</h2></div><p class="score">' + GM.score + ' / ' + GM.max + '</p><p class="q-sub">' + word + (rec ? ' Nouveau record.' : '') + '</p>';
  if (GM.errs.length){
    h += '<h3 class="sec-h" style="font-size:1.2rem">À retenir</h3><ul class="errs">';
    for (var i = 0; i < GM.errs.length; i++) h += '<li>' + esc(GM.errs[i]) + '</li>';
    h += '</ul>';
  }
  h += '<div class="row"><button type="button" class="btn" id="g-again">Rejouer</button><button type="button" class="btn alt" id="g-home">Autres défis</button></div></div>';
  $('defis').innerHTML = h;
  $('g-again').focus();
}

/* ---------- Mes repères (révision) ---------- */
var R = {queue:[], cur:null, back:false};
function repPool(){ return BASE.filter(function(e){ return e.r && inArr(S.prefs.rlevels, e.n); }); }
function buildQueue(){
  var pool = shuffle(repPool().slice());
  pool.sort(function(a, b){ return (S.mastery[a.id] || 0) - (S.mastery[b.id] || 0); });

  R.cur = R.queue.shift() || null; R.back = false;
}
function renderRevision(rebuild){

    }

  } else if (!R.cur){

    if (!R.back){

    } else {
      h += '<div class="ans"><span class="ad">' + cap(fdate(c)) + '</span><br>' + (c.y < -10000 ? cap(agoText(c)) : centOf(c.y)) + ', ' + periodOf(c.y).name + '<p>' + esc(c.d) + '</p></div>';
      h += '<div class="row"><button type="button" class="btn" id="r-yes">Je savais</button><button type="button" class="btn alt" id="r-no">À revoir</button></div>';

var resetArmed = false;
$('revision').addEventListener('click', function(ev){
  var b = ev.target.closest ? ev.target.closest('button') : null;
  if (!b) return;
  if (b.hasAttribute('data-rl')){ toggleLevel(S.prefs.rlevels, b.getAttribute('data-rl')); renderRevision(true); return; }
  if (b.id === 'r-mode'){ S.prefs.rlist = !S.prefs.rlist; save(); renderRevision(); return; }
  if (b.id === 'r-reset'){
    if (!resetArmed){ resetArmed = true; b.textContent = 'Confirmer la remise à zéro'; b.style.color = 'var(--ko)'; return; }
    resetArmed = false; S.mastery = {}; save(); renderRevision(true); return;
  }
  if (b.id === 'r-flip'){ R.back = true; renderRevision(); return; }
  if (b.id === 'r-restart'){ renderRevision(true); return; }
  if (b.id === 'r-yes' || b.id === 'r-no'){
    var id = R.cur;
    if (b.id === 'r-yes') S.mastery[id] = Math.min(3, (S.mastery[id] || 0) + 1);
    else { S.mastery[id] = 0; R.queue.splice(Math.min(3, R.queue.length), 0, id); }
    save();
    R.cur = R.queue.shift() || null; R.back = false;
    if (!R.cur) R.finished = true;

  }
});

    S.custom = S.custom.filter(function(e){ return e.id !== id; }); save(); renderPerso();
    return;
  }
  if (b.id === 'p-gen' || b.id === 'p-copy'){
    var code = JSON.stringify({frise:1, events:S.custom.map(function(e){ var o2 = {t:e.t, y:e.y}; if (e.y2 != null) o2.y2 = e.y2; if (e.a) o2.a = true; if (e.d) o2.d = e.d; return o2; })});
    var ta = $('p-code'); ta.value = code;
    if (b.id === 'p-copy'){
      var done = function(){ $('p-msg').textContent = 'Code copié.'; };
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(code).then(done, function(){ ta.select(); try { document.execCommand('copy'); done(); } catch (e) { $('p-msg').textContent = 'Sélectionne le code et copie-le à la main.'; } });
      } else { ta.select(); try { document.execCommand('copy'); done(); } catch (e) { $('p-msg').textContent = 'Sélectionne le code et copie-le à la main.'; } }
    }
    return;
  }
  if (b.id === 'p-doimp'){
    var raw = $('p-imp').value.trim(), msg = $('p-msg');
    msg.className = 'ok-msg';
    var data = null;
    try { data = JSON.parse(raw); } catch (e) { data = null; }
    var arr = data && data.events instanceof Array ? data.events : (data instanceof Array ? data : null);
    if (!arr){ msg.className = 'err'; msg.textContent = 'Ce code n’est pas reconnu. Vérifie qu’il a été copié en entier.'; return; }
    var added = 0, skipped = 0;
    for (var i = 0; i < arr.length; i++){
      var it = arr[i];
      if (!validItem(it)){ skipped++; continue; }
      var dup = S.custom.some(function(e){ return e.t === it.t.trim() && e.y === it.y; });
      if (dup){ skipped++; continue; }
      var n = {id:'p' + Date.now().toString(36) + i + Math.floor(Math.random() * 1000), t:it.t.trim().slice(0, 120), y:Math.round(it.y), a:!!it.a, d:typeof it.d === 'string' ? it.d.slice(0, 500) : ''};
      if (it.y2 != null) n.y2 = Math.round(it.y2);
      S.custom.push(n); added++;
    }
    save();
    if (added && !inArr(S.prefs.levels, 'p')){ S.prefs.levels.push('p'); save(); renderTools(); }
    renderPerso();
    $('p-msg').textContent = added + ' événement' + (added > 1 ? 's' : '') + ' importé' + (added > 1 ? 's' : '') + (skipped ? ', ' + skipped + ' ignoré' + (skipped > 1 ? 's' : '') + ' (doublon ou invalide)' : '') + '.';
  }
});

  if (a.type === 'classer'){ AT.order = shuffle(a.items.map(function(_, i){ return i; })); }
  if (a.type === 'ordre'){ AT.order = shuffle(a.items.map(function(_, i){ return i; })); var guard = 0; while (guard++ < 10 && AT.order.join() === a.items.map(function(_, i){ return i; }).join()) shuffle(AT.order); }

}

function renderAtQ(){
  var a = AT.a, qs = atQuestions(), q = qs[AT.i], h = '';
  h += '<div class="prog"><i style="width:' + Math.round(AT.i / qs.length * 100) + '%"></i></div>';
  if (a.gauge) h += gaugeHTML();
  h += '<p class="q-sub">Question ' + (AT.i + 1) + ' / ' + qs.length + '</p>';
  if (q.doc) h += '<div class="doc">' + q.doc + '</div>';
  if (q.tablet) h += tabletHTML(q.tablet);
  h += '<p class="q">' + esc(q.q) + '</p><div class="opts" id="at-opts">';
  var perm = shuffle(q.opts.map(function(_, i){ return i; }));
  for (var i = 0; i < perm.length; i++) h += '<button type="button" class="opt" data-qa="' + perm[i] + '">' + esc(q.opts[perm[i]]) + '</button>';

function gaugeHTML(){
  var g = AT.a.gauge, pct = Math.max(0, AT.left / g.start * 100);

function answerAtQ(ix){
  if (AT.done) return;
  var a = AT.a, qs = atQuestions(), q = qs[AT.i], ok = ix === q.a;
  AT.done = true;
  if (ok) AT.score++;
  var bs = $('at-opts').querySelectorAll('.opt');
  for (var i = 0; i < bs.length; i++){ var v = parseInt(bs[i].getAttribute('data-qa'), 10); bs[i].disabled = true; if (v === q.a) bs[i].classList.add('ok'); else if (v === ix) bs[i].classList.add('ko'); }
  if (a.gauge && q.cost){ AT.left -= q.cost; var gEl = $('at-body').querySelector('.gauge'); if (gEl) gEl.outerHTML = gaugeHTML(); }
  var last = AT.i === qs.length - 1;
  $('at-fb').innerHTML = '<div class="fb ' + (ok ? 'ok' : 'ko') + '"><b>' + (ok ? 'Exact.' : 'Pas tout à fait. Bonne réponse : ' + esc(q.opts[q.a])) + '</b>' + esc(q.x) + '</div>';
  $('at-actions').innerHTML = '<button type="button" class="btn" id="at-nextq">' + (last ? 'Voir le bilan' : 'Question suivante') + '</button>';
  focusEl('at-nextq');
}

/* Curseur */
function renderCurseur(){
  var a = AT.a, st = a.steps[AT.step], h = '';
  AT.seen[AT.step] = true;
  h += '<div class="cur"><div class="cur-top"><button type="button" class="small-btn" id="cur-prev" aria-label="Étape précédente"' + (AT.step === 0 ? ' disabled' : '') + '>◀</button>';
  h += '<div class="cur-year">' + st.y + '</div><button type="button" class="small-btn" id="cur-next" aria-label="Étape suivante"' + (AT.step === a.steps.length - 1 ? ' disabled' : '') + '>▶</button></div>';
  h += '<input type="range" id="cur-range" min="0" max="' + (a.steps.length - 1) + '" step="1" value="' + AT.step + '" aria-label="Choisir une date">';
  h += '<div class="cur-ticks" aria-hidden="true">';
  for (var t = 0; t < a.steps.length; t++) h += '<span>' + a.steps[t].y + '</span>';
  h += '</div><p class="cur-l">' + esc(st.l) + '</p><p class="cur-v">' + esc(st.v) + '</p><div class="groups">';
  for (var g = 0; g < a.groups.length; g++){
    var gr = a.groups[g], on = inArr(st.on, gr.k);
    h += '<div class="grp-c' + (on ? '' : ' off') + '" style="--gc:var(--p-' + gr.c + ')"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="11" r="7" fill="currentColor"/><path d="M6 38 Q6 21 20 21 Q34 21 34 38 Z" fill="currentColor"/></svg><b>' + esc(gr.l) + '</b><span>' + (on ? 'votent' : 'ne votent pas') + '</span></div>';
  }
  h += '</div><p class="cur-x">' + esc(st.x) + '</p></div>';
  var seen = 0; for (var k in AT.seen) if (AT.seen.hasOwnProperty(k)) seen++;
  h += '<p class="q-sub">' + seen + ' étape' + (seen > 1 ? 's' : '') + ' explorée' + (seen > 1 ? 's' : '') + ' sur ' + a.steps.length + '</p>';
  $('at-body').innerHTML = h;
}
function setStep(n){
  var a = AT.a;
  AT.step = Math.max(0, Math.min(a.steps.length - 1, n));
  renderCurseur();
}

/* Zones */
function nextZone(){
  var a = AT.a;
  if (AT.i >= AT.queue.length){ finishAtelier(AT.score, a.zones.length); return; }
  var z = a.zones[AT.queue[AT.i]];
  AT.firstTry = true; AT.done = false;
  $('at-prompt').innerHTML = '<p class="q-sub">Lieu ' + (AT.i + 1) + ' / ' + a.zones.length + '</p><p class="q">' + esc(z.q) + '</p>';
  $('at-fb').innerHTML = ''; $('at-actions').innerHTML = '';
}
function clickZone(k, g){
  if (AT.done || AT.i >= AT.queue.length) return;
  var a = AT.a, z = a.zones[AT.queue[AT.i]];
  if (AT.found[k]) { $('at-fb').innerHTML = '<div class="fb ko">Tu as déjà trouvé ce lieu. Cherche ailleurs.</div>'; return; }
  if (k === z.k){
    AT.done = true;
    if (AT.firstTry) AT.score++;
    AT.found[k] = true;
    var gs = $('at-scene').querySelectorAll('.zone[data-z="' + k + '"]');
    for (var i = 0; i < gs.length; i++) gs[i].classList.add('found');
    var last = AT.i === AT.queue.length - 1;
    $('at-fb').innerHTML = '<div class="fb ok"><b>' + (AT.firstTry ? 'Trouvé du premier coup !' : 'Trouvé.') + '</b>' + esc(z.x) + '</div>';
    $('at-actions').innerHTML = '<button type="button" class="btn" id="at-nextz">' + (last ? 'Voir le bilan' : 'Lieu suivant') + '</button>';
    focusEl('at-nextz');
  } else {
    AT.firstTry = false;
    var lbl = '';
    for (var j = 0; j < a.zones.length; j++) if (a.zones[j].k === k) lbl = a.zones[j].l;
    g.classList.remove('miss'); void g.getBoundingClientRect(); g.classList.add('miss');
    $('at-fb').innerHTML = '<div class="fb ko">Non, ici c’est : ' + esc(lbl) + '. Essaie encore.</div>';
  }
}

/* Classer et ordre */
function checkClasser(){
  var a = AT.a, good = 0;
  for (var i = 0; i < a.items.length; i++){
    var it = a.items[i], ok = AT.sel[i] === it.k;
    if (ok) good++;
    var box = $('at-body').querySelector('.cl-item[data-i="' + i + '"]');
    box.classList.add(ok ? 'ok' : 'ko');
    var lab = '';
    for (var c = 0; c < a.cats.length; c++) if (a.cats[c].k === it.k) lab = a.cats[c].l;
    var x = box.querySelector('.cl-x'); x.hidden = false;
    x.innerHTML = (ok ? '<b>Exact.</b> ' : '<b>Réponse : ' + esc(lab) + '.</b> ') + esc(it.x || '');
    var bs = box.querySelectorAll('.cl-b'); for (var b = 0; b < bs.length; b++) bs[b].disabled = true;
  }
  finishAtelier(good, a.items.length, true);
}
function checkOrdre(){
  var a = AT.a, good = 0, bs = $('at-body').querySelectorAll('.opt');
  for (var b = 0; b < bs.length; b++){
    var oi = parseInt(bs[b].getAttribute('data-oi'), 10), p = AT.sel.indexOf(oi), ok = p === oi;
    if (ok) good++;
    bs[b].classList.add(ok ? 'ok' : 'ko'); bs[b].disabled = true;
    var sm = bs[b].querySelector('small'); sm.hidden = false; sm.textContent = cap(a.items[oi].d) + (ok ? '' : ' · place correcte : ' + (oi + 1));
  }
  finishAtelier(good, a.items.length, true);
}

function finishAtelier(s, m, inline){
  var a = AT.a, prev = S.at[a.id];
  if (!prev || (m && s / m > prev.s / prev.m)) S.at[a.id] = {s:s, m:m};
  save();
  var h = '<div class="fb ' + (a.grave ? 'neutral' : (s === m ? 'ok' : 'ko')) + ' at-end">';
  if (a.grave) h += '<b>Exercice terminé.</b>';
  else h += '<span class="at-score">' + s + ' / ' + m + '</span><b>' + (s === m ? 'Sans faute !' : (s / m >= 0.6 ? 'Bien joué.' : 'Relis les corrections et réessaie.')) + '</b>';
  if (a.outro) h += '<p class="at-outro">' + esc(a.outro) + '</p>';
  h += '</div>';
  var actions = '<button type="button" class="btn" id="at-again">Recommencer</button><button type="button" class="btn alt" id="at-back2">Tous les ateliers</button>';
  if (a.ev && byId(a.ev)) actions += '<button type="button" class="btn alt" id="at-frise">Voir sur la frise</button>';
  if (inline){
    $('at-fb').innerHTML = h; $('at-actions').innerHTML = actions;
  } else {
    var body = $('at-body') || $('at-prompt');
    if (body) body.innerHTML = '';
    if ($('at-prompt')) $('at-prompt').innerHTML = '';
    $('at-fb').innerHTML = h; $('at-actions').innerHTML = actions;
  }
  var fb = $('at-fb'); if (fb.scrollIntoView) fb.scrollIntoView({block:'nearest'});
  focusEl('at-again');
}
function focusEl(id){ var e = $(id); if (e){ try { e.focus({preventScroll:true}); } catch (x) { e.focus(); } } }

$('ateliers').addEventListener('click', function(ev){
  var t = ev.target;
  var zg = t.closest ? t.closest('.zone') : null;
  if (zg && AT && AT.a.type === 'zones'){ clickZone(zg.getAttribute('data-z'), zg); return; }
  var b = t.closest ? t.closest('button') : null;
  if (!b) return;
  if (b.hasAttribute('data-al')){ toggleLevel(S.prefs.alevels, b.getAttribute('data-al')); renderAteliersHome(); return; }
  if (b.hasAttribute('data-at')){ startAtelier(b.getAttribute('data-at')); return; }
  if (b.id === 'at-back' || b.id === 'at-back2'){ renderAteliersHome(); window.scrollTo(0, 0); return; }
  if (!AT) return;
  if (b.id === 'at-again'){ startAtelier(AT.a.id); return; }
  if (b.id === 'at-frise'){ goToEvent(AT.a.ev); return; }
  var a = AT.a;
  if (a.type === 'classer'){
    if (b.id === 'at-check'){ checkClasser(); b.remove(); return; }
    if (b.classList.contains('cl-b')){
      var i = parseInt(b.getAttribute('data-i'), 10);
      AT.sel[i] = b.getAttribute('data-k');
      var sib = b.parentNode.querySelectorAll('.cl-b');
      for (var s = 0; s < sib.length; s++) sib[s].setAttribute('aria-pressed', sib[s] === b ? 'true' : 'false');
      var n = 0; for (var j = 0; j < a.items.length; j++) if (AT.sel[j]) n++;
      $('at-check').disabled = n !== a.items.length;
    }
    return;
  }
  if (a.type === 'ordre'){
    if (b.id === 'at-check'){ checkOrdre(); return; }
    if (b.hasAttribute('data-oi') && !b.disabled){
      var oi = parseInt(b.getAttribute('data-oi'), 10), p = AT.sel.indexOf(oi);
      if (p >= 0) AT.sel.splice(p, 1); else AT.sel.push(oi);
      var bs = $('at-body').querySelectorAll('.opt');
      for (var k = 0; k < bs.length; k++){
        var idx = AT.sel.indexOf(parseInt(bs[k].getAttribute('data-oi'), 10)), ne = bs[k].querySelector('.num');
        ne.textContent = idx >= 0 ? idx + 1 : ''; ne.className = 'num' + (idx >= 0 ? ' on' : '');
      }
      $('at-check').disabled = AT.sel.length !== a.items.length;
    }
    return;
  }
  if (a.type === 'zones'){
    if (b.id === 'at-nextz'){ AT.i++; nextZone(); }
    return;
  }
  if (a.type === 'curseur' && AT.phase === 'explore'){
    if (b.id === 'cur-prev') setStep(AT.step - 1);
    else if (b.id === 'cur-next') setStep(AT.step + 1);
    else if (b.id === 'at-toq'){ AT.phase = 'qcm'; AT.i = 0; AT.score = 0; renderAtelier(); }
    return;
  }
  if (b.hasAttribute('data-qa')){ answerAtQ(parseInt(b.getAttribute('data-qa'), 10)); return; }
  if (b.id === 'at-nextq'){
    AT.i++;
    if (AT.i >= atQuestions().length) finishAtelier(AT.score, atQuestions().length);
    else renderAtQ();
  }
});
$('ateliers').addEventListener('input', function(ev){
  if (ev.target.id === 'cur-range' && AT){ setStep(parseInt(ev.target.value, 10)); var r = $('cur-range'); if (r) r.focus(); }
});
$('ateliers').addEventListener('keydown', function(ev){
  var zg = ev.target.closest ? ev.target.closest('.zone') : null;
  if (zg && (ev.key === 'Enter' || ev.key === ' ')){ ev.preventDefault(); clickZone(zg.getAttribute('data-z'), zg); }
});


/* ---------- Thème ---------- */
var THEMES = ['light', 'dark', 'auto'], THEME_LABEL = {auto:'auto', light:'clair', dark:'sombre'};
function applyTheme(){
  var t = S.prefs.theme || 'auto';
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  $('theme').textContent = 'Thème : ' + THEME_LABEL[t];
}
$('theme').addEventListener('click', function(){
  var t = S.prefs.theme || 'auto';
  S.prefs.theme = THEMES[(THEMES.indexOf(t) + 1) % THEMES.length];
  save(); applyTheme();
});

/* ---------- Lecture facilitée ---------- */
function applyDys(){
  document.body.classList.toggle('dys', !!S.prefs.dys);
  $('dys').setAttribute('aria-pressed', S.prefs.dys ? 'true' : 'false');
}
$('dys').addEventListener('click', function(){
  var y = centerYear();
  S.prefs.dys = !S.prefs.dys; save(); applyDys();
  if (current === 'frise') renderTimeline({keepYear:y});
});

/* ---------- Mise en page réactive ---------- */
function measureStick(){ document.documentElement.style.setProperty('--stick', $('tabs').offsetHeight + 'px'); }
var rsT = null, lastW = 0;
window.addEventListener('resize', function(){
  clearTimeout(rsT);
  rsT = setTimeout(function(){
    measureStick();
    var w = $('tl').clientWidth;
    if (current === 'frise' && w !== lastW){ lastW = w; renderTimeline({keepYear:centerYear()}); }
  }, 180);
});

/* ---------- Démarrage ---------- */
applyTheme();
applyDys();
renderTools();
measureStick();
show('frise');
lastW = $('tl').clientWidth;
if (document.fonts && document.fonts.ready){
  document.fonts.ready.then(function(){ measureStick(); if (current === 'frise'){ var y = window.pageYOffset > 50 ? centerYear() : null; renderTimeline(y != null ? {keepYear:y} : {}); } });
}
})();

</script>

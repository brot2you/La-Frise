<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Frise vivante — l’histoire au collège</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23151A3A%22%2F%3E%3Cpath%20d%3D%22M10%2032h44%22%20stroke%3D%22%23FFFFFF%22%20stroke-width%3D%224%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M14%2025v14%22%20stroke%3D%22%23E58A00%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M23%2025v14%22%20stroke%3D%22%230E9C9A%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M32%2022v20%22%20stroke%3D%22%23A88AF0%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M41%2025v14%22%20stroke%3D%22%23E8436A%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M50%2025v14%22%20stroke%3D%22%233D86F0%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M11%2048h42%22%20stroke%3D%22%23F0A500%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Figtree:wght@400;500;600;700;800&family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7FC; --surface:#FFFFFF; --ink:#151A3A; --ink-soft:#5C6285; --line:rgba(21,26,58,.13);
  --accent:#4B3FD8; --accent-ink:#FFFFFF; --gold:#F0A500; --ok:#14865A; --ok-soft:#DDF5EA; --ko:#D02B4E; --ko-soft:#FDE3E9;
  --p-pre:#E58A00; --p-ant:#0E9C9A; --p-moy:#6B4FBB; --p-mod:#E8436A; --p-cont:#2D63E8;
  --t-pre:#FFF2DC; --t-ant:#DDF6F3; --t-moy:#EEE8FB; --t-mod:#FFE7EC; --t-cont:#E3ECFF;
  --spectrum:linear-gradient(90deg,#E58A00,#0E9C9A 28%,#6B4FBB 52%,#E8436A 76%,#2D63E8);
  --display:"Unbounded", "Trebuchet MS", Arial, sans-serif;
  --sans:"Figtree", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --serif:var(--sans);
  --stick:52px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1330; --surface:#1B2149; --ink:#F3F1FF; --ink-soft:#AEB2D6; --line:rgba(243,241,255,.16);
    --accent:#9D93FF; --accent-ink:#120E3A; --gold:#FFC43D; --ok:#5EE0A6; --ok-soft:#14372B; --ko:#FF7D98; --ko-soft:#43182A;
    --p-pre:#FFB238; --p-ant:#3ED6CF; --p-moy:#A98BFF; --p-mod:#FF6F91; --p-cont:#6E9BFF;
    --t-pre:#2B2312; --t-ant:#102E35; --t-moy:#211C47; --t-mod:#36182B; --t-cont:#14224F;
    --spectrum:linear-gradient(90deg,#FFB238,#3ED6CF 28%,#A98BFF 52%,#FF6F91 76%,#6E9BFF);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1330; --surface:#1B2149; --ink:#F3F1FF; --ink-soft:#AEB2D6; --line:rgba(243,241,255,.16);
  --accent:#9D93FF; --accent-ink:#120E3A; --gold:#FFC43D; --ok:#5EE0A6; --ok-soft:#14372B; --ko:#FF7D98; --ko-soft:#43182A;
  --p-pre:#FFB238; --p-ant:#3ED6CF; --p-moy:#A98BFF; --p-mod:#FF6F91; --p-cont:#6E9BFF;
  --t-pre:#2B2312; --t-ant:#102E35; --t-moy:#211C47; --t-mod:#36182B; --t-cont:#14224F;
  --spectrum:linear-gradient(90deg,#FFB238,#3ED6CF 28%,#A98BFF 52%,#FF6F91 76%,#6E9BFF);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1.0625rem;line-height:1.5}
body.dys{--display:"Lexend", Verdana, Arial, sans-serif;--sans:"Lexend", Verdana, Arial, sans-serif;letter-spacing:.03em;word-spacing:.12em;line-height:1.7}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none !important}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}

/* En-tête */
.top{padding:24px 0 0}
.top .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.top h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(1.75rem,6vw,2.9rem);line-height:1.05;letter-spacing:-.02em}
.top p{margin:.45rem 0 0;color:var(--ink-soft);max-width:46ch}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.dysbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.45rem .95rem;cursor:pointer;font-weight:700;font-size:.92rem;min-height:40px}
.dysbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.spectrum{height:6px;background:var(--spectrum);margin-top:18px}

/* Onglets */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:none;padding:.8rem .9rem .7rem;cursor:pointer;font-weight:700;color:var(--ink-soft);border-bottom:3px solid transparent;font-size:1rem}
.tab[aria-selected="true"]{color:var(--ink);border-image:var(--spectrum) 1;border-bottom-width:3px;border-bottom-style:solid}

/* Barre d’outils */
.tools{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:14px 0 12px}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.grp-l{font-size:.85rem;color:var(--ink-soft);font-weight:700;margin-right:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.32rem .8rem;cursor:pointer;font-weight:700;font-size:.92rem;display:inline-flex;align-items:center;gap:.4rem;min-height:36px}
.chip .dot{width:.65rem;height:.65rem;border-radius:50%;background:var(--lv)}
.chip[aria-pressed="true"]{border-color:var(--ink)}
.chip[aria-pressed="false"]{opacity:.55;background:transparent}
.chip[aria-pressed="false"] .dot{background:transparent;box-shadow:inset 0 0 0 2px var(--lv)}
.chip.go{opacity:1;background:transparent;font-weight:600}
.chip.go[data-go]{border-color:var(--lv);border-width:1.5px}
.chip:hover{border-color:var(--ink-soft)}

/* Frise */
#tl{position:relative;margin:0 auto;max-width:1100px;overflow:hidden}
.band{position:absolute;left:0;right:0;border-top:2px solid var(--pc)}
.band::before{content:"";position:absolute;top:0;bottom:0;left:calc(var(--cx) - 3px);width:6px;border-radius:3px;background:var(--pc)}
.band.s-pre{background:var(--t-pre);--pc:var(--p-pre)} .band.s-ant{background:var(--t-ant);--pc:var(--p-ant)}
.band.s-moy{background:var(--t-moy);--pc:var(--p-moy)} .band.s-mod{background:var(--t-mod);--pc:var(--p-mod)}
.band.s-cont{background:var(--t-cont);--pc:var(--p-cont)}
.plabel{position:-webkit-sticky;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--stick) + 10px);z-index:6;width:-webkit-fit-content;width:fit-content;margin:10px 12px 0 auto;padding:.3rem .85rem .35rem;border-radius:999px;background:var(--pc);color:#fff;font-family:var(--display);font-weight:600;font-size:.95rem}
:root[data-theme="dark"] .plabel{color:#0F1330}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .plabel{color:#0F1330} }
.s-pre{--pc:var(--p-pre)} .s-ant{--pc:var(--p-ant)} .s-moy{--pc:var(--p-moy)} .s-mod{--pc:var(--p-mod)} .s-cont{--pc:var(--p-cont)}
.compact .plabel{display:none}
.core{display:none}
.tick{position:absolute;transform:translate(-50%,-50%);z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 .45rem;font-size:.76rem;font-weight:700;white-space:nowrap;color:var(--ink-soft);line-height:1.65;font-variant-numeric:tabular-nums}
.tick.bound{background:var(--ink);color:var(--bg);border-color:var(--ink);font-size:.8rem}
.tick.end{background:var(--spectrum);color:#fff;border:0;padding:.05rem .6rem;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.rupt{position:absolute;z-index:3;color:var(--ink);opacity:.5;transform:translateY(-50%);height:14px;display:flex;justify-content:center}
.rupt svg{display:block}
.dot2{position:absolute;z-index:4;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--lv);transform:translate(-50%,-50%)}
.dur{position:absolute;z-index:3;width:4px;border-radius:2px;background:var(--lv);opacity:.55}
#links{position:absolute;left:0;top:0;z-index:1;pointer-events:none;overflow:visible}
#links line{stroke:var(--ink-soft);stroke-width:1;opacity:.4}
.ev{position:absolute;top:0;z-index:5;display:block;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:.5rem .75rem .55rem 1rem;cursor:pointer;box-shadow:0 1px 2px rgba(21,26,58,.06),0 4px 14px rgba(21,26,58,.05);overflow:hidden}
.ev::before{content:"";position:absolute;top:0;bottom:0;width:5px;background:var(--lv)}
.ev.R::before{left:0} .ev.L::before{right:0}
.ev.L{padding:.5rem 1rem .55rem .75rem}
.ev.perso{border:1.5px dashed var(--lv)}
.ev:hover{border-color:var(--lv)}
.ev .d{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap;font-weight:800;font-size:.8rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.ev .t{display:block;font-weight:600;font-size:1rem;line-height:1.28;margin-top:.1rem}
.lvb{font-size:.68rem;font-weight:800;padding:0 .38rem;border-radius:999px;border:1px solid var(--line);color:var(--ink-soft)}
.rp{display:inline-block;font-size:.68rem;padding:0 .42rem;border-radius:999px;background:var(--gold);color:#2A1C00;font-weight:800;letter-spacing:.02em}
.ev.flash{animation:flash 1.8s ease 1}
@keyframes flash{0%,55%{box-shadow:0 0 0 4px var(--lv)}100%{box-shadow:0 0 0 0 transparent}}
.phead{position:absolute;z-index:5;display:flex;align-items:baseline;flex-wrap:wrap;gap:.2rem .6rem;padding:.25rem .8rem .3rem;border-radius:999px;background:var(--pc);color:#fff}
:root[data-theme="dark"] .phead{color:#0F1330}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .phead{color:#0F1330} }
.phead span{font-family:var(--display);font-weight:600;font-size:1rem;line-height:1.3}
.phead small{font-weight:700;font-size:.8rem;opacity:.85}
.empty{padding:40px 16px;text-align:center;color:var(--ink-soft)}

/* Viseur et compteur temporel */
.viseur{position:fixed;left:0;right:0;top:50%;z-index:15;height:0;border-top:1.5px dashed var(--ink);opacity:.3;pointer-events:none}
.fbar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.fbar > *{pointer-events:auto}
.info{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:.45rem .9rem .5rem 1.05rem;font-size:.8rem;line-height:1.3;box-shadow:0 6px 22px rgba(21,26,58,.16);max-width:64vw;overflow:hidden;min-width:9.5rem}
.info::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--lv,var(--accent))}
.info .cl{display:block;color:var(--ink-soft);font-weight:700}
.info b{display:block;font-family:var(--display);font-weight:700;font-size:1.55rem;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.info b small{font-size:.55em;font-weight:600}
.info .cp{display:block;font-weight:800;color:var(--ink)}
.info .cs{display:block;color:var(--ink-soft)}
.zoom{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:0 6px 22px rgba(21,26,58,.16)}
.zoom button{width:44px;height:44px;border-radius:50%;border:0;background:var(--bg);font-size:1.4rem;font-weight:700;cursor:pointer;line-height:1}
.zoom button:disabled{opacity:.35;cursor:default}
.zoom output{min-width:3.2ch;text-align:center;font-weight:800;font-size:.85rem}
#v-frise{padding-bottom:100px}

/* Fiche */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(15,19,48,.45)}
.sheet-in{background:var(--surface);width:100%;max-width:620px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));position:relative;border-top:8px solid var(--lv)}
@media (min-width:700px){.sheet{align-items:center}.sheet-in{border-radius:20px}}
.sheet-x{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:1.3rem;line-height:1}
.sh-date{margin:0;font-weight:800;color:var(--ink-soft);padding-right:50px;display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.sheet h2{margin:.2rem 0 .9rem;font-family:var(--display);font-weight:700;font-size:1.4rem;line-height:1.2;padding-right:40px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:.35rem .9rem;margin:0 0 1rem;font-size:.95rem}
.facts dt{color:var(--ink-soft);font-weight:700}
.facts dd{margin:0}
.sheet .desc{font-size:1.08rem;line-height:1.65;margin:0 0 1rem;max-width:60ch}

/* Boutons */
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:12px;padding:.65rem 1.15rem;font-weight:800;cursor:pointer;min-height:44px}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Défis */
.sec-h{font-family:var(--display);font-weight:700;font-size:1.45rem;margin:24px 0 6px;letter-spacing:-.01em}
.sec-p{margin:0 0 14px;color:var(--ink-soft);max-width:60ch}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:16px 0 30px}
.mode{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:18px 16px 16px 22px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:140px}
.mode::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--lv)}
.mode:hover{border-color:var(--lv)}
.mode b{font-family:var(--display);font-size:1.08rem;font-weight:700}
.mode span{color:var(--ink-soft);font-size:.95rem}
.mode em{margin-top:auto;font-style:normal;font-weight:800;font-size:.85rem;color:var(--ink)}
.msg{padding:.6rem .9rem;border-radius:12px;background:var(--ko-soft);color:var(--ink);margin:8px 0}
.game{max-width:680px;margin:18px auto 40px}
.g-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.g-head h2{margin:0;font-family:var(--display);font-weight:700;font-size:1.2rem}
.g-head span{color:var(--ink-soft);font-weight:700;font-size:.92rem}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px}
.prog i{display:block;height:100%;background:var(--spectrum);background-size:680px 100%}
.q{font-size:1.4rem;font-weight:800;line-height:1.25;margin:.2rem 0 .3rem}
.q-sub{color:var(--ink-soft);margin:0 0 14px}
.big-date{display:inline-block;font-family:var(--display);font-weight:700;font-size:1.25rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.25rem .8rem;margin-bottom:14px;font-variant-numeric:tabular-nums}
.opts{display:grid;gap:8px;margin-bottom:14px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:.8rem 1rem;cursor:pointer;font-size:1.05rem;font-weight:700;min-height:52px}
.opts.two .opt{font-size:1.05rem;min-height:110px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--ok-soft);border-color:var(--ok);border-width:2px}
.opt.ko{background:var(--ko-soft);border-color:var(--ko);border-width:2px}
.opt small{display:block;font-weight:800;color:var(--ink-soft);margin-top:.3rem;font-size:.9rem}
.ord{display:grid;gap:8px;margin-bottom:14px}
.ord .opt{display:flex;align-items:center;gap:.8rem}
.num{flex:0 0 auto;width:2rem;height:2rem;border-radius:50%;border:2px dashed var(--line);display:inline-flex;align-items:center;justify-content:center;font-weight:800}
.num.on{border-style:solid;border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.fb{border-radius:14px;padding:.85rem 1rem;margin-bottom:14px;line-height:1.5}
.fb.ok{background:var(--ok-soft)} .fb.ko{background:var(--ko-soft)}
.fb b{display:block;margin-bottom:.2rem}
.fb ol{margin:.4rem 0 0;padding-left:1.3rem}
.score{font-family:var(--display);font-weight:800;font-size:3rem;line-height:1;margin:.4rem 0;background:var(--spectrum);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.errs{margin:12px 0 18px;padding:0;list-style:none;display:grid;gap:6px}
.errs li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.55rem .8rem;font-size:.95rem}

/* Révision */
.card{position:relative;overflow:hidden;max-width:560px;margin:10px auto 20px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px 20px 20px 26px;min-height:220px;display:flex;flex-direction:column;box-shadow:0 6px 22px rgba(21,26,58,.08)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--lv)}
.card .lvl{font-weight:800;font-size:.85rem;color:var(--ink-soft)}
.card .ct{font-family:var(--display);font-weight:700;font-size:1.3rem;line-height:1.25;margin:.4rem 0 1rem}
.card .ans{border-top:1px dashed var(--line);padding-top:.8rem;margin-bottom:1rem}
.card .ans .ad{font-family:var(--display);font-weight:700;font-size:1.2rem}
.card .ans p{margin:.4rem 0 0}
.card .row{margin-top:auto}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:6px 0 4px;max-width:560px}
.bar i{display:block;height:100%;background:var(--spectrum);background-size:560px 100%}
.tbl-w{overflow-x:auto;margin:10px 0 40px}
table{border-collapse:collapse;width:100%;min-width:520px;background:var(--surface);border-radius:14px;overflow:hidden}
th,td{text-align:left;padding:.55rem .75rem;border-bottom:1px solid var(--line);vertical-align:top;font-size:.95rem}
th{font-size:.85rem;color:var(--ink-soft)}
td.dt{font-weight:800;white-space:nowrap}
.lvl-dot{display:inline-block;width:.65rem;height:.65rem;border-radius:50%;background:var(--lv);margin-right:.4rem}
.mst{display:inline-flex;gap:3px}
.mst i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ok)}
.mst i.on{background:var(--ok)}

/* Ma frise */
.form{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px;max-width:640px}
.field label{display:block;font-weight:700;font-size:.92rem;margin-bottom:.25rem}
.field input[type=text],.field input[type=number],.field textarea{width:100%;font:inherit;padding:.55rem .7rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:44px}
.field textarea{min-height:90px;resize:vertical}
.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.inline input[type=number]{max-width:10rem}
.ck{display:inline-flex;align-items:center;gap:.4rem;font-weight:500;font-size:.95rem;cursor:pointer}
.ck input{width:1.15rem;height:1.15rem;accent-color:var(--accent)}
.err{color:var(--ko);font-weight:700;min-height:1.2em;margin:0}
.ok-msg{color:var(--ok);font-weight:700;min-height:1.2em;margin:0}
.plist{list-style:none;padding:0;margin:12px 0;display:grid;gap:8px;max-width:640px}
.plist li{background:var(--surface);border:1.5px dashed var(--line);border-radius:14px;padding:.6rem .8rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.plist .pt{flex:1 1 200px}
.plist .pt b{display:block;font-size:.85rem;color:var(--ink-soft)}
.plist .pt span{font-weight:600;font-size:1.02rem}
.small-btn{border:1px solid var(--line);background:transparent;border-radius:10px;padding:.35rem .75rem;cursor:pointer;font-weight:700;font-size:.9rem;min-height:38px}
.small-btn.danger{color:var(--ko);border-color:var(--ko)}
.share textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem}

/* Ateliers */
.lv-h{font-family:var(--display);font-weight:700;font-size:1.15rem;margin:22px 0 0}
.tag{align-self:flex-start;font-size:.72rem;font-weight:800;padding:.05rem .5rem;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--ink-soft);margin-bottom:4px}
.at .small-btn{margin-bottom:12px}
.at-meta{margin:0;color:var(--ink-soft);font-weight:700;font-size:.9rem}
.at-title{margin:.15rem 0 .5rem;font-family:var(--display);font-weight:700;font-size:1.45rem;line-height:1.2}
.at-title::after{content:"";display:block;width:56px;height:5px;border-radius:3px;background:var(--lv);margin-top:.5rem}
.at-intro{margin:0 0 .8rem;max-width:62ch}
.cl-list{display:grid;gap:10px;margin-bottom:14px}
.cl-item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.8rem 1rem}
.cl-item p{margin:0 0 .55rem;font-weight:600;line-height:1.4}
.cl-opts{display:flex;flex-wrap:wrap;gap:6px}
.cl-b{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:.35rem .8rem;cursor:pointer;font-weight:700;font-size:.9rem;min-height:38px;text-align:left}
.cl-b[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cl-b:disabled{cursor:default}
.cl-item.ok{border-color:var(--ok);background:var(--ok-soft)}
.cl-item.ko{border-color:var(--ko);background:var(--ko-soft)}
.cl-x{margin-top:.55rem;font-size:.95rem}
.fb.neutral{background:var(--surface);border:1px solid var(--line)}
.at-end{margin-top:6px}
.at-score{display:block;font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1.1;margin-bottom:.2rem}
.at-outro{margin:.5rem 0 0}
.scene{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px;margin-bottom:12px}
.scene svg{display:block;width:100%;height:auto;max-height:62vh}
.sc-ground{fill:var(--t-pre)} .sc-sky{fill:var(--t-cont)}
.sc-wall{fill:var(--t-ant);stroke:var(--ink-soft);stroke-width:4;stroke-dasharray:10 4}
.sc-road{fill:var(--surface);opacity:.85}
.sc-house{fill:var(--line)}
.sc-b{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.sc-in{fill:var(--line);stroke:var(--ink);stroke-width:1}
.sc-win{fill:var(--t-cont);stroke:var(--ink);stroke-width:1}
.sc-line{fill:none;stroke:var(--ink);stroke-width:2}
.sc-thin{stroke:var(--ink-soft);stroke-width:1.5}
.sc-dot{fill:var(--ink)}
.sc-water{fill:var(--p-cont);opacity:.45}
.sc-smoke{fill:var(--ink-soft);opacity:.25}
.sc-coal{fill:var(--ink)}
.sc-tree{fill:var(--p-ant);opacity:.7}
.sc-txt{fill:var(--ink);font-family:var(--sans);font-weight:800}
.sc-bust{fill:var(--surface);stroke:var(--ink);stroke-width:1.2}
.sc-cap{fill:#E2324A}
.zone{cursor:pointer;outline:none}
.zone .hit{fill:transparent;stroke:transparent;stroke-width:2.5;rx:8}
.zone:hover .hit{fill:var(--accent);fill-opacity:.08}
.zone:focus-visible .hit{stroke:var(--accent)}
.zone.found .hit{fill:var(--ok);fill-opacity:.22;stroke:var(--ok)}
.zone.miss .hit{animation:miss .7s ease 1}
@keyframes miss{0%,60%{fill:var(--ko);fill-opacity:.3}100%{fill-opacity:0}}
.lbl{display:none;font-family:var(--sans);font-weight:800;font-size:11px;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.zone.found .lbl{display:inline}
.prompt-box .q{margin-top:0}
.tablet{display:inline-flex;flex-direction:column;gap:8px;background:#D8B98A;border-radius:14px 20px 12px 18px;padding:14px 18px;margin:0 0 14px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.12)}
.tab-line{display:flex;gap:5px;align-items:center}
.gl{display:inline-block;width:26px;height:26px;color:#4A3519;flex:0 0 auto}
.gl svg{display:block;width:100%;height:100%}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.6rem .9rem;margin:0 0 12px;font-size:.92rem}
.legend .doc-l{flex-basis:100%}
.legend .lg{display:inline-flex;align-items:center;gap:.4rem}
.legend .gl{background:#D8B98A;border-radius:6px;padding:3px;width:28px;height:28px}
.doc{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--lv);border-radius:12px;padding:.8rem 1rem;margin-bottom:14px;font-size:.98rem;line-height:1.6}
.doc p{margin:.2rem 0}
.doc-l{font-size:.8rem;font-weight:800;color:var(--ink-soft)}
.gauge{margin-bottom:12px}
.gauge-t{font-size:.95rem}
.gauge-t b{font-family:var(--display);font-size:1.5rem}
.gauge .bar i{background:var(--p-pre)}
.cur{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.cur-top{display:flex;align-items:center;justify-content:center;gap:16px}
.cur-year{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:center}
.cur input[type=range]{width:100%;margin:14px 0 4px;accent-color:var(--accent);height:28px}
.cur-ticks{display:flex;justify-content:space-between;font-size:.72rem;font-weight:700;color:var(--ink-soft)}
.cur-l{font-weight:800;font-size:1.15rem;margin:.8rem 0 0;text-align:center}
.cur-v{margin:.1rem 0 .8rem;text-align:center;color:var(--ink-soft);font-weight:700}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.grp-c{border:1.5px solid var(--gc);border-radius:14px;padding:.6rem .5rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;transition:opacity .25s}
.grp-c svg{width:40px;height:40px;color:var(--gc)}
.grp-c b{font-size:.88rem;line-height:1.2}
.grp-c span{font-size:.8rem;color:var(--ink-soft);font-weight:700}
.grp-c.off{opacity:.3;border-style:dashed}
.cur-x{margin:.9rem 0 0;line-height:1.5}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important;scroll-behavior:auto !important}
}

<script type="application/json" id="ateliers-data">{"ateliers": [{"id": "a-nomade", "n": "6", "theme": "La longue histoire de l’humanité et des migrations", "title": "Nomade ou sédentaire ?", "type": "classer", "ev": "e4", "intro": "Il y a environ 12 000 ans, au Proche-Orient, les humains changent de mode de vie : c’est le début du Néolithique.", "consigne": "Range chaque activité avant ou après le passage au Néolithique.", "cats": [{"k": "nom", "l": "Avant : chasseurs-cueilleurs nomades"}, {"k": "sed", "l": "Après : agriculteurs sédentaires"}], "items": [{"t": "Habiter un campement provisoire sous une tente de peaux", "k": "nom", "x": "Les chasseurs-cueilleurs se déplacent en suivant le gibier et les saisons."}, {"t": "Cultiver du blé et de l’orge", "k": "sed", "x": "L’agriculture apparaît au Proche-Orient vers 10 000 av. J.-C."}, {"t": "Chasser le renne et cueillir des baies", "k": "nom", "x": "La chasse, la pêche et la cueillette nourrissent les groupes nomades."}, {"t": "Élever des moutons et des chèvres", "k": "sed", "x": "La domestication des animaux accompagne l’agriculture."}, {"t": "Construire une maison durable dans un village", "k": "sed", "x": "En restant près de leurs champs, les humains fondent les premiers villages."}, {"t": "Tailler des pointes de silex pour chasser le gibier", "k": "nom", "x": "Le silex taillé est utilisé depuis des centaines de milliers d’années par les chasseurs."}, {"t": "Fabriquer des poteries pour stocker les récoltes", "k": "sed", "x": "La céramique se développe avec le besoin de conserver les réserves."}, {"t": "Polir une hache de pierre pour défricher la forêt", "k": "sed", "x": "La pierre polie permet d’abattre des arbres pour ouvrir des champs."}, {"t": "Peindre des animaux sur les parois d’une grotte", "k": "nom", "x": "Les peintures de Chauvet ou de Lascaux sont l’œuvre de chasseurs-cueilleurs."}, {"t": "Stocker des réserves de grain dans des silos", "k": "sed", "x": "Les réserves permettent de nourrir plus de monde… et créent des richesses à protéger."}], "outro": "Avec l’agriculture et l’élevage, la population augmente, les villages grandissent et les sociétés deviennent plus inégalitaires."}, {"id": "a-uruk", "n": "6", "theme": "Premiers États, premières écritures", "title": "Le scribe d’Uruk", "type": "qcm", "ev": "e7", "legend": true, "intro": "Vers 3300 av. J.-C., à Uruk en Mésopotamie, des scribes tracent des signes sur l’argile. Les signes ci-dessous sont simplifiés, mais le principe est le même : un signe pour le nombre, un signe pour la chose comptée.", "consigne": "Déchiffre les tablettes à l’aide de la légende.", "questions": [{"q": "Combien de sacs d’orge sont enregistrés ?", "tablet": [["d", "d", "u", "u", "u", "orge"]], "opts": ["23", "32", "5", "203"], "a": 0, "x": "Deux signes de dizaine (2 × 10) et trois unités : 23 sacs d’orge."}, {"q": "Que dit cette tablette ?", "tablet": [["d", "u", "u", "mouton"], ["d", "d", "d", "u", "orge"]], "opts": ["12 moutons et 31 sacs d’orge", "21 moutons et 13 sacs d’orge", "3 moutons et 4 sacs d’orge", "12 sacs d’orge et 31 moutons"], "a": 0, "x": "Première ligne : 10 + 2 = 12 moutons. Deuxième ligne : 30 + 1 = 31 sacs d’orge."}, {"q": "Le scribe note la ration de 5 ouvriers. Combien de sacs chaque ouvrier reçoit-il ?", "tablet": [["u", "u", "u", "u", "u", "ouvrier"], ["d", "u", "u", "u", "u", "u", "orge"]], "opts": ["3", "5", "10", "15"], "a": 0, "x": "5 ouvriers se partagent 15 sacs : 15 ÷ 5 = 3 sacs chacun."}, {"q": "Pourquoi les premiers écrits de Mésopotamie servent-ils surtout à compter ?", "opts": ["Pour gérer les récoltes, les troupeaux et les impôts des temples et des rois", "Pour écrire des romans d’aventure", "Pour envoyer des lettres d’amour", "Pour apprendre à lire à tous les enfants"], "a": 0, "x": "Les premières tablettes sont des documents de gestion : l’écriture naît pour administrer des États de plus en plus grands."}], "outro": "L’invention de l’écriture marque traditionnellement la fin de la Préhistoire et le début de l’Histoire."}, {"id": "a-ecclesia", "n": "6", "theme": "Le monde des cités grecques", "title": "Qui vote à l’Ecclésia ?", "type": "classer", "ev": "e16", "intro": "À Athènes, au Ve siècle av. J.-C., les citoyens se réunissent à l’Ecclésia, l’assemblée du peuple, pour voter les lois et décider de la guerre ou de la paix.", "consigne": "Pour chaque habitant, décide s’il peut voter à l’Ecclésia.", "cats": [{"k": "oui", "l": "Il peut voter"}, {"k": "non", "l": "Il ne peut pas voter"}], "items": [{"t": "Un homme de 30 ans, né d’un père et d’une mère athéniens", "k": "oui", "x": "Il est citoyen : homme libre, majeur, né de parents athéniens."}, {"t": "L’épouse d’un citoyen athénien", "k": "non", "x": "Les femmes sont exclues de la vie politique, même filles ou épouses de citoyens."}, {"t": "Un riche marchand venu de Syracuse, installé à Athènes depuis 20 ans", "k": "non", "x": "C’est un métèque : un étranger libre, qui paie des impôts mais n’est pas citoyen."}, {"t": "Un esclave qui travaille dans les mines d’argent du Laurion", "k": "non", "x": "Les esclaves, très nombreux, n’ont aucun droit politique."}, {"t": "Un garçon de 15 ans, fils de citoyens", "k": "non", "x": "Il est trop jeune : on ne participe à l’assemblée qu’une fois majeur, vers 18 ans."}, {"t": "Un paysan pauvre de 40 ans, fils de citoyens", "k": "oui", "x": "La richesse ne compte pas : les citoyens pauvres votent aussi. Une indemnité permet même aux plus modestes de siéger dans les tribunaux."}, {"t": "Un ancien esclave qui a été affranchi", "k": "non", "x": "L’affranchi devient libre, mais pas citoyen : il prend le statut de métèque."}], "outro": "Seule une minorité des habitants d’Athènes est citoyenne, environ un sur dix. La démocratie athénienne est réelle, mais très limitée."}, {"id": "a-rome", "n": "6", "theme": "Rome, du mythe à l’histoire", "title": "Mythe ou histoire ?", "type": "classer", "ev": "e12", "intro": "Les Romains racontent la naissance de leur ville par des légendes. Les historiens et les archéologues, eux, s’appuient sur des traces et des sources.", "consigne": "Classe chaque affirmation : récit légendaire ou fait établi par l’histoire ?", "cats": [{"k": "leg", "l": "Légende (récit mythique)"}, {"k": "his", "l": "Histoire (sources, archéologie)"}], "items": [{"t": "Romulus et Remus sont allaités par une louve", "k": "leg", "x": "C’est un épisode du récit des origines, raconté par des auteurs romains bien plus tard."}, {"t": "Rome est fondée par Romulus le 21 avril 753 av. J.-C.", "k": "leg", "x": "Cette date précise a été calculée par des savants romains : elle relève de la tradition."}, {"t": "Des traces de cabanes du VIIIe siècle av. J.-C. ont été retrouvées sur le Palatin", "k": "his", "x": "L’archéologie montre que le site est bien habité à cette époque."}, {"t": "Le Troyen Énée est l’ancêtre des Romains", "k": "leg", "x": "Le poète Virgile popularise ce récit sous Auguste, dans l’Énéide."}, {"t": "Au VIe siècle av. J.-C., Rome est dominée par des rois étrusques", "k": "his", "x": "Sources et fouilles montrent la forte influence étrusque sur la Rome royale."}, {"t": "Romulus tue son frère qui a franchi le sillon sacré", "k": "leg", "x": "Ce meurtre fondateur fait partie de la légende."}, {"t": "Les Romains honorent de nombreux dieux, comme Jupiter et Mars", "k": "his", "x": "Temples, inscriptions et textes attestent cette religion polythéiste."}, {"t": "Le dieu Mars est le père des jumeaux", "k": "leg", "x": "En donnant un père divin à Romulus, la légende glorifie Rome."}], "outro": "Le mythe ne dit pas ce qui s’est passé, mais ce que les Romains voulaient croire d’eux-mêmes : un peuple choisi par les dieux."}, {"id": "a-villeromaine", "n": "6", "theme": "L’Empire romain dans le monde antique", "title": "Enquête dans une ville romaine", "type": "zones", "svg": "romaine", "ev": "e19", "intro": "Après la conquête, les villes de Gaule se couvrent de monuments copiés sur ceux de Rome. Voici le plan simplifié d’une cité gallo-romaine.", "consigne": "Retrouve chaque lieu sur le plan.", "zones": [{"k": "forum", "l": "Forum", "q": "Trouve la grande place publique où l’on se réunit pour la politique, la justice et le commerce.", "x": "Le forum est le cœur de la cité, comme à Rome."}, {"k": "temple", "l": "Temple", "q": "Trouve le temple, où l’on honore les dieux et l’empereur.", "x": "Le culte impérial unit les habitants autour de l’empereur. La Maison carrée de Nîmes en est un exemple."}, {"k": "thermes", "l": "Thermes", "q": "Trouve les bains publics, où l’on se lave, fait du sport et discute.", "x": "Les thermes, avec leurs bassins chauds et froids, sont un lieu de vie sociale."}, {"k": "amphi", "l": "Amphithéâtre", "q": "Trouve le monument où se déroulent les combats de gladiateurs.", "x": "Les arènes de Nîmes et d’Arles sont des amphithéâtres romains."}, {"k": "theatre", "l": "Théâtre", "q": "Trouve le monument en demi-cercle où l’on assiste à des pièces.", "x": "Le théâtre d’Orange est l’un des mieux conservés du monde romain."}, {"k": "aqueduc", "l": "Aqueduc", "q": "Trouve l’ouvrage qui apporte l’eau des sources jusqu’à la ville.", "x": "Le pont du Gard faisait partie de l’aqueduc qui alimentait Nîmes."}], "outro": "En adoptant ces monuments et ce mode de vie, les élites gauloises se romanisent."}, {"id": "a-chretiens", "n": "6", "theme": "L’Empire romain dans le monde antique", "title": "De la persécution à la religion officielle", "type": "ordre", "ev": "e26", "intro": "En moins de quatre siècles, le christianisme passe du statut de religion persécutée à celui de religion de l’Empire.", "consigne": "Remets ces étapes dans l’ordre chronologique.", "items": [{"t": "Jésus prêche en Palestine et meurt crucifié à Jérusalem", "d": "vers 30"}, {"t": "Paul de Tarse voyage pour diffuser le christianisme autour de la Méditerranée", "d": "vers 45-60"}, {"t": "Néron accuse les chrétiens de l’incendie de Rome", "d": "64"}, {"t": "Grande persécution sous l’empereur Dioclétien", "d": "303"}, {"t": "L’édit de Milan autorise le christianisme", "d": "313"}, {"t": "Théodose fait du christianisme la religion officielle", "d": "380"}], "outro": "Le christianisme, né dans le monde juif, s’est diffusé grâce aux routes et aux villes de l’Empire romain."}, {"id": "a-carrefour", "n": "5", "theme": "Chrétientés et islam (VIe-XIIIe siècles), des mondes en contact", "title": "Le carrefour méditerranéen", "type": "qcm", "ev": "e41", "intro": "Au Moyen Âge, la Méditerranée relie trois mondes : l’Occident chrétien, l’Empire byzantin et le monde musulman. Marchandises et savoirs y circulent.", "consigne": "Réponds aux questions.", "questions": [{"q": "Le papier, inventé en Chine, arrive en Occident grâce…", "opts": ["au monde musulman, qui le fabrique à Bagdad puis en Espagne", "aux Vikings", "aux seuls croisés", "aux Romains"], "a": 0, "x": "Le savoir-faire chinois passe dans le monde musulman au VIIIe siècle, puis gagne l’Espagne musulmane et l’Europe."}, {"q": "Nos chiffres (0, 1, 2, 3…) viennent…", "opts": ["d’Inde, transmis par les savants du monde musulman", "de Rome", "de Grèce", "d’Égypte"], "a": 0, "x": "On les appelle « chiffres arabes », mais ils ont été inventés en Inde."}, {"q": "Au XIIe siècle, l’Occident redécouvre les œuvres du philosophe grec Aristote grâce…", "opts": ["à des traductions en latin, faites notamment à Tolède à partir de l’arabe", "à des manuscrits retrouvés dans une grotte", "aux moines vikings", "aux marchands chinois"], "a": 0, "x": "Les savants du monde musulman avaient traduit et commenté les auteurs grecs. Ces textes sont ensuite traduits en latin."}, {"q": "Venise et Gênes sont…", "opts": ["de grandes cités marchandes qui commercent avec Byzance et les ports musulmans", "des monastères", "des royaumes musulmans", "des villes de l’Empire byzantin en Asie"], "a": 0, "x": "Leurs marchands rapportent épices, soie et produits de luxe d’Orient."}, {"q": "Au Moyen Âge, Constantinople est…", "opts": ["la capitale chrétienne de l’Empire byzantin et un grand carrefour commercial", "la capitale des califes", "une petite ville de pêcheurs", "la capitale de Charlemagne"], "a": 0, "x": "Avec ses centaines de milliers d’habitants, elle relie l’Europe et l’Asie."}, {"q": "Les croisades montrent que la Méditerranée est aussi…", "opts": ["un espace d’affrontements entre chrétiens et musulmans", "une mer fermée à toute circulation", "une région sans religion", "un territoire entièrement chrétien"], "a": 0, "x": "Échanges et conflits coexistent : on commerce même pendant les croisades."}], "outro": "La Méditerranée médiévale est à la fois une frontière et un carrefour."}, {"id": "a-seigneurie", "n": "5", "theme": "Société, Église et pouvoir politique dans l’Occident féodal", "title": "Une année à la seigneurie", "type": "qcm", "ev": "e38", "gauge": {"start": 100, "unit": "sacs de grain"}, "intro": "Tu es un paysan au XIIe siècle. Ta récolte de l’année : 100 sacs de grain. Les chiffres sont simplifiés, mais les prélèvements sont réels.", "consigne": "Retrouve le nom de chaque prélèvement et regarde ce qu’il te reste.", "questions": [{"q": "Pour avoir le droit de cultiver ta tenure, tu verses chaque année une redevance au seigneur.", "opts": ["Le cens", "La dîme", "La corvée", "La banalité"], "a": 0, "cost": 15, "x": "Le cens est la redevance due au seigneur pour la terre qu’il te concède."}, {"q": "L’Église prélève environ un dixième de ta récolte.", "opts": ["La taille", "La dîme", "Le cens", "La gabelle"], "a": 1, "cost": 10, "x": "La dîme finance le clergé."}, {"q": "Tu dois faire moudre ton grain au moulin du seigneur et lui laisser une part.", "opts": ["La corvée", "La dîme", "La banalité", "Le cens"], "a": 2, "cost": 10, "x": "Les banalités obligent à utiliser le moulin, le four ou le pressoir du seigneur, contre paiement."}, {"q": "Plusieurs jours par an, tu travailles gratuitement sur les terres du seigneur, pendant que tes propres champs attendent.", "opts": ["La banalité", "La corvée", "La dîme", "L’aumône"], "a": 1, "cost": 10, "x": "La corvée est un travail gratuit dû au seigneur sur sa réserve."}, {"q": "Tu gardes 20 sacs comme semences pour l’an prochain. Combien reste-t-il pour nourrir ta famille ?", "opts": ["35", "55", "65", "100"], "a": 0, "cost": 20, "x": "100 − 15 − 10 − 10 − 10 − 20 = 35 sacs : à peine de quoi tenir jusqu’à la récolte suivante, surtout si l’année est mauvaise."}], "outro": "Les paysans, l’immense majorité de la population, nourrissent ceux qui prient (le clergé) et ceux qui combattent (les seigneurs)."}, {"id": "a-domaine", "n": "5", "theme": "Société, Église et pouvoir politique dans l’Occident féodal", "title": "Le domaine royal s’agrandit", "type": "ordre", "ev": "e39", "intro": "En 987, le roi capétien ne contrôle directement qu’un petit territoire. Au fil des siècles, guerres, mariages et héritages agrandissent le domaine royal.", "consigne": "Remets ces étapes dans l’ordre chronologique.", "items": [{"t": "Philippe Auguste conquiert la Normandie", "d": "1204"}, {"t": "Le comté de Toulouse est rattaché au domaine royal", "d": "1271"}, {"t": "Le Dauphiné passe au roi de France", "d": "1349"}, {"t": "Louis XI s’empare de la Bourgogne", "d": "1477"}, {"t": "Louis XI hérite de la Provence", "d": "1481"}, {"t": "La Bretagne est unie au royaume de France", "d": "1532"}], "outro": "En s’agrandissant, le domaine royal renforce le pouvoir du roi face aux grands seigneurs."}, {"id": "a-absolu", "n": "5", "theme": "Transformations de l’Europe et ouverture sur le monde (XVIe-XVIIe siècles)", "title": "Les outils du roi absolu", "type": "classer", "ev": "e62", "intro": "Louis XIV ne partage son pouvoir avec personne. Pour l’imposer, il dispose de nombreux moyens.", "consigne": "Associe chaque élément au pouvoir qu’il représente. Chaque réponse ne sert qu’une fois.", "cats": [{"k": "dieu", "l": "Un pouvoir qui vient de Dieu"}, {"k": "juge", "l": "Le roi rend la justice"}, {"k": "arm", "l": "Le roi fait la guerre"}, {"k": "prov", "l": "Le roi contrôle les provinces"}, {"k": "nob", "l": "Le roi domine la noblesse"}, {"k": "rel", "l": "Le roi impose une seule religion"}], "items": [{"t": "Le sacre à Reims, où le roi reçoit une huile sainte", "k": "dieu", "x": "Le sacre fait du roi un élu de Dieu : c’est la monarchie de droit divin."}, {"t": "La main de justice, remise lors du sacre", "k": "juge", "x": "Le roi est le juge suprême du royaume."}, {"t": "Une armée permanente très nombreuse et les forteresses de Vauban", "k": "arm", "x": "Louis XIV mène de nombreuses guerres et fortifie les frontières."}, {"t": "Les intendants, envoyés dans les provinces pour appliquer ses ordres", "k": "prov", "x": "Ils représentent le roi et contrôlent justice, police et finances."}, {"t": "Le château de Versailles et l’étiquette de la Cour", "k": "nob", "x": "Les nobles vivent auprès du roi, qui les surveille et les occupe."}, {"t": "La révocation de l’édit de Nantes en 1685", "k": "rel", "x": "« Un roi, une foi » : le protestantisme est interdit."}], "outro": "La monarchie absolue concentre tous les pouvoirs entre les mains du roi."}, {"id": "a-reforme", "n": "5", "theme": "Transformations de l’Europe et ouverture sur le monde (XVIe-XVIIe siècles)", "title": "Catholique ou protestant ?", "type": "classer", "ev": "e54", "intro": "À partir de 1517, Luther puis Calvin remettent en cause l’Église catholique. La chrétienté occidentale se divise.", "consigne": "Classe chaque affirmation : position catholique ou protestante ?", "cats": [{"k": "cat", "l": "Catholiques"}, {"k": "pro", "l": "Protestants"}], "items": [{"t": "Seule la Bible est la source de la foi", "k": "pro", "x": "Les protestants rejettent les traditions qui ne sont pas dans l’Écriture."}, {"t": "Le pape est le chef de l’Église", "k": "cat", "x": "Les protestants refusent l’autorité du pape."}, {"t": "Chaque fidèle doit pouvoir lire la Bible dans sa langue", "k": "pro", "x": "Luther traduit la Bible en allemand ; l’imprimerie aide à la diffuser."}, {"t": "La Vierge Marie et les saints peuvent intercéder pour les fidèles", "k": "cat", "x": "Le culte des saints est réaffirmé par l’Église catholique."}, {"t": "Les pasteurs peuvent se marier", "k": "pro", "x": "Les prêtres catholiques, eux, doivent rester célibataires."}, {"t": "Il existe sept sacrements", "k": "cat", "x": "Les protestants n’en gardent que deux : le baptême et la cène."}, {"t": "On est sauvé par la foi seule, pas grâce aux indulgences", "k": "pro", "x": "C’est le cœur de la critique de Luther en 1517."}, {"t": "Le concile de Trente réaffirme la doctrine de l’Église", "k": "cat", "x": "C’est la réponse catholique à la Réforme (1545-1563)."}], "outro": "Ces divisions mènent en France aux guerres de Religion, jusqu’à l’édit de Nantes en 1598."}, {"id": "a-cqsol", "n": "5", "theme": "Transformations de l’Europe et ouverture sur le monde (XVIe-XVIIe siècles)", "title": "Charles Quint ou Soliman ?", "type": "classer", "ev": "e57", "intro": "Au XVIe siècle, deux souverains dominent l’Europe et la Méditerranée : l’empereur Charles Quint et le sultan ottoman Soliman.", "consigne": "Qui suis-je ? Attribue chaque indice au bon souverain.", "cats": [{"k": "cq", "l": "Charles Quint"}, {"k": "so", "l": "Soliman"}], "items": [{"t": "Je suis élu empereur du Saint-Empire en 1519", "k": "cq", "x": "Charles Quint est déjà roi d’Espagne."}, {"t": "Je règne sur l’Empire ottoman de 1520 à 1566", "k": "so", "x": "Sous Soliman, l’Empire ottoman est à son apogée."}, {"t": "J’assiège Vienne en 1529", "k": "so", "x": "Les Ottomans menacent le cœur de l’Europe."}, {"t": "Je règne sur l’Espagne et ses colonies d’Amérique", "k": "cq", "x": "L’or et l’argent d’Amérique financent ses guerres."}, {"t": "Les Européens me surnomment « le Magnifique »", "k": "so", "x": "Ses sujets l’appellent aussi « le Législateur »."}, {"t": "Je convoque Luther à la diète de Worms en 1521", "k": "cq", "x": "Luther refuse de renier ses idées devant l’empereur."}, {"t": "Je m’allie au roi de France François Ier contre mon rival", "k": "so", "x": "Une alliance étonnante entre un roi chrétien et un sultan musulman."}, {"t": "J’abdique et je me retire près d’un monastère espagnol", "k": "cq", "x": "Épuisé, il partage ses possessions en 1556."}], "outro": "Leur rivalité se joue sur terre, en Europe centrale, et sur mer, en Méditerranée."}, {"id": "a-traite", "n": "4", "theme": "Le XVIIIe siècle : expansions, Lumières et révolutions", "title": "Le commerce triangulaire", "type": "classer", "grave": true, "ev": "e65", "intro": "Au XVIIIe siècle, des navires partis de ports comme Nantes ou Bordeaux font un voyage en trois étapes. La traite négrière en est le cœur.", "consigne": "Classe ce qui circule sur chacun des trois trajets.", "cats": [{"k": "ea", "l": "Europe → Afrique"}, {"k": "aa", "l": "Afrique → Amériques"}, {"k": "ae", "l": "Amériques → Europe"}], "items": [{"t": "Tissus, armes, alcool et objets de verre", "k": "ea", "x": "Ces marchandises sont échangées contre des captifs sur les côtes africaines."}, {"t": "Barres de fer et pacotille", "k": "ea", "x": "Elles servent aussi de monnaie d’échange dans la traite."}, {"t": "Captifs africains réduits en esclavage", "k": "aa", "x": "Entassés dans les cales pendant des semaines, beaucoup meurent pendant la traversée."}, {"t": "Sucre", "k": "ae", "x": "Produit par les esclaves dans les plantations des Antilles, comme à Saint-Domingue."}, {"t": "Café", "k": "ae", "x": "Les plantations coloniales en fournissent toute l’Europe."}, {"t": "Coton et indigo", "k": "ae", "x": "Ces produits enrichissent négociants et armateurs européens."}], "outro": "Environ 12 millions d’Africains ont été déportés vers les Amériques entre le XVIe et le XIXe siècle. Depuis la loi Taubira de 2001, la France reconnaît la traite et l’esclavage comme un crime contre l’humanité."}, {"id": "a-lumieres", "n": "4", "theme": "Le XVIIIe siècle : expansions, Lumières et révolutions", "title": "Qui a dit quoi ?", "type": "classer", "ev": "e66", "intro": "Les philosophes des Lumières veulent éclairer les esprits par la raison et critiquent l’absolutisme. Les idées ci-dessous sont reformulées, sauf la dernière, presque mot pour mot.", "consigne": "Associe chaque idée à son auteur. Chaque nom ne sert qu’une fois.", "cats": [{"k": "mon", "l": "Montesquieu"}, {"k": "vol", "l": "Voltaire"}, {"k": "rou", "l": "Rousseau"}, {"k": "did", "l": "Diderot"}, {"k": "oly", "l": "Olympe de Gouges"}], "items": [{"t": "Pour éviter la tyrannie, celui qui fait les lois ne doit pas être celui qui les applique ni celui qui juge.", "k": "mon", "x": "C’est la séparation des pouvoirs, dans De l’esprit des lois (1748)."}, {"t": "Il faut tolérer toutes les religions et combattre le fanatisme.", "k": "vol", "x": "Voltaire publie son Traité sur la tolérance en 1763."}, {"t": "Le pouvoir appartient au peuple, qui exprime la volonté générale.", "k": "rou", "x": "Rousseau développe cette idée dans Du contrat social (1762)."}, {"t": "Il faut rassembler toutes les connaissances dans un grand ouvrage pour éclairer les hommes.", "k": "did", "x": "Diderot dirige l’Encyclopédie avec d’Alembert à partir de 1751."}, {"t": "La femme naît libre et demeure égale à l’homme en droits.", "k": "oly", "x": "Article 1 de la Déclaration des droits de la femme et de la citoyenne (1791)."}], "outro": "Ces idées inspirent les révolutions américaine et française."}, {"id": "a-ddhc", "n": "4", "theme": "Le XVIIIe siècle : expansions, Lumières et révolutions", "title": "1789 contre l’Ancien Régime", "type": "classer", "ev": "e70", "intro": "Texte authentique : voici six articles de la Déclaration des droits de l’homme et du citoyen du 26 août 1789. Chacun abolit un trait de l’Ancien Régime.", "consigne": "Associe chaque article à ce qu’il fait disparaître. Chaque réponse ne sert qu’une fois.", "cats": [{"k": "ord", "l": "La société d’ordres et les privilèges de naissance"}, {"k": "abs", "l": "Le pouvoir absolu du roi"}, {"k": "emp", "l": "Les charges réservées à la noblesse"}, {"k": "arb", "l": "Les arrestations arbitraires (lettres de cachet)"}, {"k": "cen", "l": "La censure"}, {"k": "imp", "l": "Les privilégiés dispensés d’impôts"}], "items": [{"t": "Article 1 : « Les hommes naissent et demeurent libres et égaux en droits. Les distinctions sociales ne peuvent être fondées que sur l’utilité commune. »", "k": "ord", "x": "La naissance ne donne plus de droits particuliers."}, {"t": "Article 3 : « Le principe de toute Souveraineté réside essentiellement dans la Nation. »", "k": "abs", "x": "Le pouvoir ne vient plus de Dieu ni du roi, mais de la Nation."}, {"t": "Article 6 (extrait) : « Tous les Citoyens étant égaux à ses yeux sont également admissibles à toutes dignités, places et emplois publics, selon leur capacité, et sans autre distinction que celle de leurs vertus et de leurs talents. »", "k": "emp", "x": "Le talent remplace la naissance pour accéder aux emplois publics."}, {"t": "Article 7 (extrait) : « Nul homme ne peut être accusé, arrêté ni détenu que dans les cas déterminés par la Loi, et selon les formes qu’elle a prescrites. »", "k": "arb", "x": "Fini l’emprisonnement sur simple ordre du roi."}, {"t": "Article 11 (extrait) : « La libre communication des pensées et des opinions est un des droits les plus précieux de l’Homme. »", "k": "cen", "x": "Chacun peut parler, écrire et imprimer librement, dans le cadre de la loi."}, {"t": "Article 13 (extrait) : « Une contribution commune est indispensable : elle doit être également répartie entre tous les citoyens, en raison de leurs facultés. »", "k": "imp", "x": "Tout le monde paie l’impôt, selon ses moyens."}], "outro": "La Déclaration pose les bases d’une société d’individus libres et égaux en droits, encore à l’origine de notre Constitution."}, {"id": "a-journees", "n": "4", "theme": "Le XVIIIe siècle : expansions, Lumières et révolutions", "title": "Les grandes journées de la Révolution", "type": "ordre", "ev": "e69", "intro": "Entre 1789 et 1793, la France passe de la monarchie absolue à la République.", "consigne": "Remets ces événements dans l’ordre chronologique.", "items": [{"t": "Ouverture des États généraux à Versailles", "d": "5 mai 1789"}, {"t": "Prise de la Bastille", "d": "14 juillet 1789"}, {"t": "Abolition des privilèges", "d": "nuit du 4 août 1789"}, {"t": "Déclaration des droits de l’homme et du citoyen", "d": "26 août 1789"}, {"t": "Fuite du roi, arrêté à Varennes", "d": "juin 1791"}, {"t": "Proclamation de la République", "d": "21 septembre 1792"}, {"t": "Exécution de Louis XVI", "d": "21 janvier 1793"}], "outro": "La fuite à Varennes brise la confiance entre le roi et les révolutionnaires, et ouvre la voie à la République."}, {"id": "a-industrie", "n": "4", "theme": "L’Europe et le monde au XIXe siècle", "title": "La ville industrielle", "type": "zones", "svg": "industrie", "ev": "e67", "intro": "Au XIXe siècle, l’industrialisation transforme les paysages : usines, mines et chemins de fer font naître de nouvelles villes.", "consigne": "Retrouve chaque lieu dans la scène.", "zones": [{"k": "usine", "l": "Usine", "q": "Trouve l’usine textile et ses hautes cheminées.", "x": "Les machines à vapeur, alimentées au charbon, font tourner les métiers à tisser."}, {"k": "mine", "l": "Mine de charbon", "q": "Trouve la mine de charbon et son chevalement.", "x": "Le charbon est l’énergie de l’industrialisation. Des enfants travaillent aussi au fond."}, {"k": "cite", "l": "Cité ouvrière", "q": "Trouve la cité ouvrière : des maisons identiques construites par le patron.", "x": "Le patron loge ses ouvriers près de l’usine… et les contrôle ainsi."}, {"k": "patron", "l": "Maison du patron", "q": "Trouve la maison du patron.", "x": "La bourgeoisie industrielle s’enrichit et vit dans de vastes demeures."}, {"k": "gare", "l": "Gare", "q": "Trouve la gare, où arrivent les matières premières et les voyageurs.", "x": "Le chemin de fer transporte charbon, marchandises et ouvriers venus des campagnes."}], "outro": "L’industrialisation fait naître deux groupes sociaux nouveaux : la bourgeoisie industrielle et le monde ouvrier."}, {"id": "a-suffrage", "n": "4", "theme": "Société, culture et politique dans la France du XIXe siècle", "title": "Qui peut voter en… ?", "type": "curseur", "ev": "e79", "intro": "De 1791 à 1974, le droit de vote s’élargit peu à peu, avec des retours en arrière.", "consigne": "Déplace le curseur pour voir qui vote à chaque époque, puis réponds aux questions.", "groups": [{"k": "ric", "l": "Hommes aisés", "c": "cont"}, {"k": "pau", "l": "Hommes modestes", "c": "ant"}, {"k": "fem", "l": "Femmes", "c": "mod"}, {"k": "jeu", "l": "Jeunes de 18 à 20 ans", "c": "pre"}], "steps": [{"y": "1791", "l": "Suffrage censitaire", "v": "Environ 4,3 millions de « citoyens actifs »", "on": ["ric"], "x": "Seuls les hommes de plus de 25 ans qui paient un impôt minimum votent, et seulement pour désigner des électeurs, plus riches encore."}, {"y": "1792", "l": "Suffrage universel masculin", "v": "Presque tous les hommes de plus de 21 ans", "on": ["ric", "pau"], "x": "Pour élire la Convention, le cens est supprimé. L’expérience ne dure pas."}, {"y": "1815", "l": "Retour au suffrage censitaire", "v": "Environ 100 000 électeurs", "on": ["ric"], "x": "Sous la Restauration, il faut avoir 30 ans et payer un impôt élevé : seuls les plus riches votent."}, {"y": "1830", "l": "Un cens abaissé", "v": "Environ 240 000 électeurs en 1846", "on": ["ric"], "x": "Sous la monarchie de Juillet, le cens et l’âge baissent, mais le vote reste réservé aux plus riches."}, {"y": "1848", "l": "Suffrage universel masculin", "v": "Environ 9 millions d’électeurs", "on": ["ric", "pau"], "x": "La IIe République donne le droit de vote à tous les hommes de plus de 21 ans. Il ne sera plus remis en cause."}, {"y": "1944", "l": "Le vote des femmes", "v": "Le corps électoral double", "on": ["ric", "pau", "fem"], "x": "Ordonnance du 21 avril 1944 ; les Françaises votent pour la première fois en 1945."}, {"y": "1974", "l": "La majorité à 18 ans", "v": "Tous les citoyens de 18 ans et plus", "on": ["ric", "pau", "fem", "jeu"], "x": "La majorité, et donc le droit de vote, passe de 21 à 18 ans."}], "questions": [{"q": "En 1791, qui peut voter ?", "opts": ["Les hommes qui paient un impôt minimum", "Tous les hommes", "Tous les adultes", "Seulement les nobles"], "a": 0, "x": "C’est le suffrage censitaire : le droit de vote dépend de la richesse."}, {"q": "En quelle année le suffrage universel masculin s’installe-t-il durablement ?", "opts": ["1789", "1848", "1870", "1944"], "a": 1, "x": "Établi en 1848, il ne sera plus supprimé, même sous le Second Empire."}, {"q": "Pourquoi parle-t-on de suffrage « universel » en 1848, alors que les femmes ne votent pas ?", "opts": ["Parce qu’on considère alors que la politique est une affaire d’hommes", "Parce que les femmes votent en secret", "Parce que les femmes votent depuis 1791", "C’est une erreur des manuels"], "a": 0, "x": "Le mot reflète les idées de l’époque. Le suffrage ne devient vraiment universel qu’en 1944."}], "outro": "Le droit de vote est une conquête progressive, souvent obtenue par des luttes."}, {"id": "a-mairie", "n": "4", "theme": "Société, culture et politique dans la France du XIXe siècle", "title": "La République au village", "type": "zones", "svg": "mairie", "ev": "e84", "intro": "Sous la IIIe République, chaque commune construit sa mairie et son école. Voici une mairie-école typique des années 1880.", "consigne": "Retrouve chaque élément sur la façade.", "zones": [{"k": "drapeau", "l": "Drapeau tricolore", "q": "Trouve le drapeau tricolore.", "x": "Bleu, blanc, rouge : le drapeau de la Révolution devient l’emblème de la République."}, {"k": "devise", "l": "Devise", "q": "Trouve la devise de la République.", "x": "« Liberté, Égalité, Fraternité » est inscrite sur les bâtiments publics à partir de 1880."}, {"k": "marianne", "l": "Marianne", "q": "Trouve Marianne, coiffée du bonnet phrygien.", "x": "Marianne représente la République ; son buste trône dans les mairies."}, {"k": "mairie", "l": "Mairie", "q": "Trouve la mairie.", "x": "Depuis la loi de 1884, le maire est élu par le conseil municipal dans toutes les communes."}, {"k": "ecoles", "l": "Écoles", "q": "Trouve les écoles.", "x": "Avec les lois Ferry (1881-1882), l’école publique devient gratuite, laïque et obligatoire. Garçons et filles sont souvent séparés."}], "outro": "Dans chaque village, la mairie-école rend la République visible et l’enseigne aux enfants."}, {"id": "a-propagande", "n": "3", "theme": "L’Europe, un théâtre majeur des guerres totales (1914-1945)", "title": "Propagande ou réalité du front ?", "type": "classer", "ev": "e89", "intro": "Pendant la Grande Guerre, la presse est censurée et diffuse un « bourrage de crâne ». Les affirmations ci-dessous sont reformulées à partir de journaux et de lettres de l’époque.", "consigne": "Classe chaque affirmation : propagande ou réalité vécue par les soldats ?", "cats": [{"k": "pro", "l": "Propagande (bourrage de crâne)"}, {"k": "rea", "l": "Réalité vécue au front"}], "items": [{"t": "Les balles allemandes ne sont pas dangereuses : la plupart traversent les chairs sans faire de mal.", "k": "pro", "x": "Ce genre d’affirmation paraît dans la presse de 1914 pour rassurer l’arrière."}, {"t": "Dans les tranchées, nous vivons dans la boue, avec les rats et les poux.", "k": "rea", "x": "Les lettres et carnets de soldats décrivent ces conditions effroyables."}, {"t": "Les soldats s’ennuient tellement qu’ils réclament de monter à l’assaut.", "k": "pro", "x": "La propagande présente la guerre comme une aventure joyeuse."}, {"t": "Le bombardement a duré des heures ; plusieurs camarades ont été ensevelis.", "k": "rea", "x": "L’artillerie est la première cause de mort au front."}, {"t": "L’armée allemande est épuisée : elle va s’effondrer dans quelques semaines.", "k": "pro", "x": "La guerre dure finalement plus de quatre ans."}, {"t": "Nous n’avons pas pu nous laver ni changer de linge depuis des semaines.", "k": "rea", "x": "L’hygiène est quasi impossible en première ligne."}, {"t": "Les cosaques russes seront à Berlin avant Noël.", "k": "pro", "x": "En 1914, beaucoup croient à une guerre courte."}, {"t": "Le courrier est contrôlé : nous ne pouvons pas tout raconter à nos familles.", "k": "rea", "x": "La censure militaire lit et coupe certaines lettres."}], "outro": "L’écart entre la propagande et le vécu crée chez les soldats un fort ressentiment envers l’arrière."}, {"id": "a-totalit", "n": "3", "theme": "L’Europe, un théâtre majeur des guerres totales (1914-1945)", "title": "Démocratie ou totalitarisme ?", "type": "classer", "ev": "e97", "intro": "Dans l’entre-deux-guerres, des démocraties comme la France ou le Royaume-Uni coexistent avec des régimes totalitaires.", "consigne": "Classe chaque caractéristique.", "cats": [{"k": "dem", "l": "Démocratie"}, {"k": "tot", "l": "Régime totalitaire"}], "items": [{"t": "Plusieurs partis se présentent librement aux élections", "k": "dem", "x": "Le pluralisme politique est la base de la démocratie."}, {"t": "Un parti unique contrôle l’État", "k": "tot", "x": "Parti fasciste, parti communiste soviétique, parti nazi."}, {"t": "Les journaux peuvent critiquer le gouvernement", "k": "dem", "x": "La liberté de la presse protège contre les abus de pouvoir."}, {"t": "Une police politique arrête les opposants", "k": "tot", "x": "Gestapo en Allemagne, NKVD en URSS."}, {"t": "Les jeunes sont embrigadés dans les organisations du parti", "k": "tot", "x": "Les Jeunesses hitlériennes en sont un exemple."}, {"t": "Les citoyens élisent librement leurs représentants", "k": "dem", "x": "Le vote est libre et secret."}, {"t": "Le chef est vénéré comme un sauveur", "k": "tot", "x": "Culte du Duce, du Führer ou de Staline."}, {"t": "Les juges sont indépendants du pouvoir", "k": "dem", "x": "La séparation des pouvoirs protège les libertés."}, {"t": "Des camps enferment les opposants et les populations persécutées", "k": "tot", "x": "Goulag en URSS, camps de concentration en Allemagne nazie."}, {"t": "Les syndicats sont libres et le droit de grève existe", "k": "dem", "x": "En Allemagne nazie, les syndicats sont dissous dès 1933."}], "outro": "Le régime totalitaire prétend contrôler toute la société, jusqu’à la pensée des individus."}, {"id": "a-affiche", "n": "3", "theme": "L’Europe, un théâtre majeur des guerres totales (1914-1945)", "title": "Enquête sur une affiche de propagande", "type": "qcm", "ev": "e101", "intro": "Analyse d’un document célèbre, connu sous le nom d’« Affiche rouge ».", "consigne": "Lis la description du document, puis réponds.", "questions": [{"q": "Qui a fait réaliser cette affiche ?", "doc": "<p class=\"doc-l\">Description du document<\/p><p>Affiche placardée en France en février 1944. Sur un fond rouge, dix médaillons montrent les visages de résistants du groupe Manouchian, arrêtés puis jugés. Sous chaque visage figurent un nom, une origine (« Juif hongrois », « Arménien », « communiste italien »…) et le nombre d’attentats attribués. En haut, une question : « Des libérateurs ? ». En bas : « La libération par l’armée du crime ! ». Au pied, des photos de trains déraillés et de victimes.<\/p>", "opts": ["Les autorités allemandes d’occupation", "La Résistance", "Les Alliés", "Le général de Gaulle"], "a": 0, "x": "C’est une affiche de propagande de l’occupant, diffusée avec l’appui du régime de Vichy."}, {"q": "Pourquoi insiste-t-elle sur l’origine étrangère et juive des résistants ?", "opts": ["Pour faire croire que la Résistance est l’œuvre d’étrangers et de criminels", "Pour rendre hommage aux étrangers", "Pour informer objectivement", "Pour recruter des résistants"], "a": 0, "x": "Elle joue sur la xénophobie et l’antisémitisme pour discréditer la Résistance."}, {"q": "Comment l’affiche désigne-t-elle les résistants ?", "opts": ["Comme une « armée du crime »", "Comme des héros", "Comme des soldats alliés", "Comme des otages"], "a": 0, "x": "L’occupant présente les résistants comme des terroristes."}, {"q": "Quel effet a-t-elle souvent produit ?", "opts": ["Beaucoup de passants y ont vu des héros ; certains ont écrit « Morts pour la France » sur l’affiche", "Elle a fait disparaître la Résistance", "Personne ne l’a remarquée", "Elle a été interdite par l’occupant"], "a": 0, "x": "La propagande se retourne : l’affiche devient un symbole de la Résistance."}, {"q": "Le groupe Manouchian appartient…", "opts": ["aux FTP-MOI, une résistance communiste qui regroupe des immigrés", "à la Milice de Vichy", "à l’armée américaine", "aux Forces françaises libres de Londres"], "a": 0, "x": "Missak Manouchian, poète arménien, et ses camarades sont fusillés le 21 février 1944. Il entre au Panthéon en 2024."}], "outro": "Analyser une affiche, c’est se demander qui parle, à qui, pour dire quoi, et ce que le document cache."}, {"id": "a-blocs", "n": "3", "theme": "Le monde depuis 1945", "title": "Deux blocs face à face", "type": "classer", "ev": "e110", "intro": "À partir de 1947, le monde se divise en deux camps : c’est la guerre froide.", "consigne": "Range chaque élément dans le bon bloc.", "cats": [{"k": "oue", "l": "Bloc de l’Ouest (autour des États-Unis)"}, {"k": "est", "l": "Bloc de l’Est (autour de l’URSS)"}], "items": [{"t": "L’OTAN, alliance militaire créée en 1949", "k": "oue", "x": "Elle unit les États-Unis, le Canada et des pays d’Europe de l’Ouest."}, {"t": "Le pacte de Varsovie, créé en 1955", "k": "est", "x": "C’est la réponse militaire de l’URSS et de ses alliés."}, {"t": "Le plan Marshall d’aide à la reconstruction", "k": "oue", "x": "L’aide américaine est refusée par l’URSS et ses alliés."}, {"t": "La RDA (Allemagne de l’Est)", "k": "est", "x": "Créée en 1949 dans la zone d’occupation soviétique."}, {"t": "La RFA (Allemagne de l’Ouest)", "k": "oue", "x": "Créée en 1949 dans les zones américaine, britannique et française."}, {"t": "Une économie planifiée par l’État", "k": "est", "x": "L’État fixe la production : c’est le modèle communiste."}, {"t": "Une économie de marché, fondée sur la li (function(){

function $(id){ return document.getElementById(id); }

/* ---------- Dates, siècles, périodes ---------- */
function sp(n){ var s = String(Math.abs(Math.round(n))); return s.length > 4 ? s.replace(/\B(?=(\d{3})+(?!\d))/g, '\u202F') : s; }

}

function milOf(y){ var n = Math.ceil(Math.abs(y) / 1000); return roman(n) + '<sup>' + (n === 1 ? 'er' : 'e') + '</sup>\u00A0millénaire' + (y < 0 ? ' av.\u00A0J.-C.' : ''); }
function periodOf(y){
  if (y < -3300) return PERIODS[0];
  if (y < 476) return PERIODS[1];

  if (n > 20000) n = Math.round(n / 1000) * 1000;

    if (y % 100 === 0) return 'Attention au piège : une année « ronde » comme ' + y + ' est la dernière année d’un siècle. ' + y + ' appartient donc au ' + H + '.';
    var c = Math.floor(y / 100);

  }

  var c2 = Math.floor(a / 100);
  return 'Avant J.-C., on compte à rebours mais le calcul reste le même : ' + c2 + ' centaine' + (c2 > 1 ? 's' : '') + ' + 1 = ' + n + '. C’est le ' + H + '.';
}

/* ---------- Géométrie de la frise ---------- */
function geom(Z, recent, floors){
  var hs = [], tot = 0, i;
  for (i = 0; i < SEG.length; i++){ hs.push(Math.max(SEG[i].h * Z, floors ? floors[i] : 0)); tot += hs[i]; }
  function pos(y){
    if (y <= SEG[0].a) return 0;
    var acc = 0;
    for (var j = 0; j < SEG.length; j++){
      var s = SEG[j];
      if (y <= s.b) return acc + (y - s.a) / (s.b - s.a) * hs[j];
      acc += hs[j];
    }
    return tot;
  }
  function Y(y){ var p = pos(y); return PAD + (recent ? tot - p : p); }
  function inv(px){
    var p = px - PAD; if (recent) p = tot - p;
    if (p <= 0) return SEG[0].a;
    var acc = 0;
    for (var j = 0; j < SEG.length; j++){
      if (p <= acc + hs[j]){ var s = SEG[j]; return s.a + (p - acc) / hs[j] * (s.b - s.a); }
      acc += hs[j];
    }
    return SEG[SEG.length - 1].b;
  }
  function segAt(y){ for (var j = 0; j < SEG.length; j++){ if (y <= SEG[j].b) return SEG[j]; } return SEG[SEG.length - 1]; }
  return {Y:Y, inv:inv, tot:tot, segAt:segAt};
}

/* Placement 1D sans chevauchement : regroupe les cartes en grappes centrées sur leurs dates */
function place(items, minTop){
  var cl = [], i, j;
  for (i = 0; i < items.length; i++){
    var it = items[i];
    var c = {items:[it], H:it.h, sum:it.des, n:1, top:it.des};
    while (cl.length){
      var p = cl[cl.length - 1];
      if (p.top + p.H + GAP > c.top){
        var shift = p.H + GAP;
        p.sum = p.sum + (c.sum - shift * c.n);
        p.items = p.items.concat(c.items);
        p.H = p.H + GAP + c.H;
        p.n += c.n;
        p.top = p.sum / p.n;
        cl.pop();
        c = p;
      } else break;
    }
    cl.push(c);
  }
  var cursor = minTop;
  for (i = 0; i < cl.length; i++){
    var top = Math.max(cl[i].top, cursor), y = top;
    for (j = 0; j < cl[i].items.length; j++){ cl[i].items[j].top = y; y += cl[i].items[j].h + GAP; }

  }
}

function fmtTick(t){ if (t === 0) return 'an 1'; return t < 0 ? '−' + sp(t) : sp(t); }

function renderTimeline(opts){

      '<span class="d">' + cap(fdate(e)) + '<span class="lvb">' + lvName(e.n) + '</span>' + (e.r ? '<span class="rp">repère</span>' : '') + '</span><span class="t">' + esc(e.t) + '</span>');

    items.push(it);
    cols[side === 'R' ? 0 : 1].push(it);
  }
  var heads = [];
  if (!roomy){
    for (i = 0; i < PERIODS.length; i++){
      var pd = PERIODS[i];
      var rng = pd.k === 'pre' ? 'jusqu’à 3300 av. J.-C.' : (pd.k === 'cont' ? 'depuis 1789' : (pd.a < 0 ? sp(pd.a) + ' av. J.-C.' : pd.a) + ' – ' + pd.b);
      var hd = el('div', 'phead s-' + pd.k, '<span>' + pd.name + '</span><small>' + rng + '</small>');
      hd.style.width = cardW + 'px'; hd.style.left = xR + 'px';
      tl.appendChild(hd);
      heads.push({head:true, el:hd, p:pd});
    }
  }
  // Hauteur minimale de chaque tronçon pour que ses cartes y tiennent
  var need = [];
  for (i = 0; i < SEG.length; i++) need.push([0, 0]);
  for (i = 0; i < items.length; i++){
    items[i].h = items[i].el.offsetHeight || 52;
    need[segIndexOf(items[i].e.y)][items[i].side === 'R' ? 0 : 1] += items[i].h + GAP;
  }
  for (i = 0; i < heads.length; i++){
    heads[i].h = heads[i].el.offsetHeight || 34;
    var sy = recent ? Math.min(heads[i].p.b, END) - 1 : heads[i].p.a + 1;
    need[segIndexOf(sy)][0] += heads[i].h + GAP;
  }
  var floors = [];
  for (i = 0; i < SEG.length; i++) floors.push(Math.max(need[i][0], need[i][1]) * 1.1);
  var g = geom(Z, recent, floors);

  for (i = 0; i < items.length; i++){
    items[i].anchor = g.Y(items[i].e.y);
    items[i].des = items[i].anchor - items[i].h / 2;
  }
  for (i = 0; i < heads.length; i++){
    var st = recent ? g.Y(Math.min(heads[i].p.b, END)) : g.Y(heads[i].p.a);
    heads[i].des = st + 6; heads[i].anchor = st + 6 + heads[i].h / 2;
    cols[0].push(heads[i]);
  }
  for (i = 0; i < cols.length; i++){
    cols[i].sort(function(a, b){ return a.anchor - b.anchor; });
    place(cols[i], 8);
  }
  for (i = 0; i < heads.length; i++) heads[i].el.style.top = heads[i].top + 'px';

  // 2. Strates, carotte, graduations
  var frag = document.createDocumentFragment();
  var bands = {};
  for (i = 0; i < PERIODS.length; i++){
    var pr = PERIODS[i];
    var y1 = g.Y(pr.a), y2 = g.Y(Math.min(pr.b, END));
    var b = el('div', 'band s-' + pr.k, '<div class="plabel">' + pr.name + '</div>');
    b.id = 'band-' + pr.k;
    b.style.top = Math.min(y1, y2) + 'px';
    b.style.height = Math.abs(y2 - y1) + 'px';
    bands[pr.k] = b;
    frag.appendChild(b);
  }
  var core = el('div', 'core');
  core.style.left = (cx - half) + 'px';
  core.style.width = CW + 'px';
  frag.appendChild(core);

  var boundY = [];
  for (i = 0; i < BOUNDS.length; i++) boundY.push(g.Y(BOUNDS[i]));
  boundY.push(g.Y(SEG[0].a)); boundY.push(g.Y(NOW));
  for (i = 0; i < SEG.length; i++){
    var s = SEG[i];
    var first = Math.ceil(s.a / s.step) * s.step;
    for (var t = first; t < s.b; t += s.step){
      if (t <= s.a) continue;
      if (t > NOW) break;
      var yy = g.Y(t), near = false;
      for (j = 0; j < boundY.length; j++){ if (Math.abs(boundY[j] - yy) < 24){ near = true; break; } }
      if (near) continue;
      var tk = el('div', 'tick', fmtTick(t));
      tk.style.left = cx + 'px'; tk.style.top = yy + 'px';
      frag.appendChild(tk);
    }
  }
  for (i = 0; i < BOUNDS.length; i++){
    var by = g.Y(BOUNDS[i]);
    var rp = el('div', 'rupt', ZIG);
    rp.title = 'Changement d’échelle';
    rp.style.left = (cx - half) + 'px'; rp.style.width = CW + 'px'; rp.style.top = (by + 16) + 'px';
    frag.appendChild(rp);
    var bt = el('div', 'tick bound', fmtTick(BOUNDS[i]));
    bt.style.left = cx + 'px'; bt.style.top = by + 'px';
    frag.appendChild(bt);
  }
  var tNow = el('div', 'tick end', 'Aujourd’hui');
  tNow.style.left = cx + 'px'; tNow.style.top = g.Y(NOW) + 'px';
  frag.appendChild(tNow);
  var tOld = el('div', 'tick end', fmtTick(SEG[0].a));
  tOld.style.left = cx + 'px'; tOld.style.top = g.Y(SEG[0].a) + 'px';
  frag.appendChild(tOld);

  // 3. Liens, points, durées
  var maxB = 0;
  var svgNS = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('id', 'links');
  svg.setAttribute('aria-hidden', 'true');
  var lanes = {R:[], L:[]};
  for (i = 0; i < items.length; i++){
    var o = items[i];
    o.el.style.top = o.top + 'px';
    o.el.style.visibility = '';
    maxB = Math.max(maxB, o.top + o.h);
    var edge = o.side === 'R' ? cx + half : cx - half;
    var cardEdge = o.side === 'R' ? xR : xL + cardW;
    var ty = Math.min(Math.max(o.anchor, o.top + 12), o.top + o.h - 12);
    var ln = document.createElementNS(svgNS, 'line');
    ln.setAttribute('x1', edge); ln.setAttribute('y1', o.anchor);
    ln.setAttribute('x2', cardEdge); ln.setAttribute('y2', ty);
    svg.appendChild(ln);
    var dt = el('div', 'dot2');
    dt.style.setProperty('--lv', 'var(--p-' + periodOf(o.e.y).k + ')');
    dt.style.left = edge + 'px'; dt.style.top = o.anchor + 'px';
    frag.appendChild(dt);
    if (o.e.y2 != null){
      var ya = g.Y(o.e.y), yb = g.Y(o.e.y2), top2 = Math.min(ya, yb), hh = Math.abs(yb - ya);
      if (hh >= 4){
        var L = lanes[o.side], lane = 0;
        while (lane < L.length && L[lane] > top2 - 2) lane++;
        L[lane] = top2 + hh;
        lane = lane % 4;
        var du = el('div', 'dur');
        du.style.setProperty('--lv', 'var(--p-' + periodOf(o.e.y).k + ')');
        du.style.top = top2 + 'px'; du.style.height = hh + 'px';
        du.style.left = (o.side === 'R' ? cx + half - 7 - lane * 6 : cx - half + 3 + lane * 6) + 'px';
        frag.appendChild(du);
      }
    }
  }
  for (i = 0; i < heads.length; i++) maxB = Math.max(maxB, heads[i].top + heads[i].h);
  var H = Math.max(g.tot + 2 * PAD, maxB + PAD);
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  frag.appendChild(svg);
  tl.insertBefore(frag, tl.firstChild);
  tl.style.height = H + 'px';

  // Les strates extrêmes couvrent tout le haut et le bas
  var topBand = recent ? bands.cont : bands.pre, botBand = recent ? bands.pre : bands.cont;
  var tTop = parseFloat(topBand.style.top);
  topBand.style.height = (parseFloat(topBand.style.height) + tTop) + 'px';
  topBand.style.top = '0px';
  var bTop = parseFloat(botBand.style.top);
  botBand.style.height = (H - bTop) + 'px';

  if (!evs.length){
    var em = el('div', 'empty', 'Aucun événement avec ces filtres. Active au moins un niveau.');
    em.style.position = 'absolute'; em.style.left = '0'; em.style.right = '0'; em.style.top = '120px'; em.style.zIndex = '7';
    tl.appendChild(em);
  }

  G = {g:g, recent:recent, W:W};
  $('zval').textContent = '×' + String(Z).replace('.', ',');
  $('zout').disabled = P.zoom === 0;
  $('zin').disabled = P.zoom === ZOOMS.length - 1;

  if (opts.focusId) focusCard(opts.focusId);
  else if (keep != null) scrollToYear(keep);
  updateInfo();
}

];

function poolFor(levels){ return BASE.filter(function(e){ return inArr(levels, e.n); }); }

function distinctYears(arr){ var s = {}, n = 0; for (var i = 0; i < arr.length; i++){ if (!s[arr[i].y]){ s[arr[i].y] = 1; n++; } } return n; }
function pickDistinct(pool, k){
  var sh = shuffle(pool.slice()), out = [], seen = {};
  for (var i = 0; i < sh.length && out.length < k; i++){ if (!seen[sh[i].y]){ seen[sh[i].y] = 1; out.push(sh[i]); } }
  return out.length === k ? out : null;
}
function shiftC(s, d){ var r = s + d; if (s > 0 && r <= 0) r -= 1; if (s < 0 && r >= 0) r += 1; return r; }

function buildQuestions(k, pool, n){
  var qs = [], i, cand;
  if (k === 'ordre'){
    if (distinctYears(pool) < 5) return null;
    for (i = 0; i < n; i++){ qs.push({items:shuffle(pickDistinct(pool, 5)), sel:[]}); }
    return qs;
  }
  if (k === 'avant'){
    if (distinctYears(pool) < 2) return null;
    for (i = 0; i < n; i++){ var pr = pickDistinct(pool, 2); qs.push({a:pr[0], b:pr[1]}); }
    return qs;
  }
  if (k === 'siecle'){
    cand = pool.filter(function(e){ return e.y >= -2000; });
    if (cand.length < 4) return null;
    cand = shuffle(cand.slice());
    for (i = 0; i < n; i++){
      var e = cand[i % cand.length];
      var s = e.y < 0 ? -centNum(e.y) : centNum(e.y);
      var opts = [s];
      var tries = e.y < 0 ? [-s, shiftC(s, -1), shiftC(s, 1), shiftC(s, 2), shiftC(s, -2)] : [shiftC(s, -1), shiftC(s, 1), shiftC(s, 2), shiftC(s, -2)];
      for (var t = 0; t < tries.length && opts.length < 4; t++){ if (opts.indexOf(tries[t]) < 0) opts.push(tries[t]); }
      opts.sort(function(a, b){ return a - b; });
      qs.push({e:e, s:s, opts:opts});
    }
    return qs;
  }
  if (k === 'periode'){
    cand = pool.filter(function(e){ return e.y !== -3300 && e.y !== 476 && e.y !== 1492 && e.y !== 1789; });
    if (cand.length < 3) return null;
    cand = shuffle(cand.slice());
    for (i = 0; i < Math.min(n, cand.length); i++) qs.push({e:cand[i], hint:false});
    return qs;
  }
  if (k === 'date'){
    cand = pool.filter(function(e){ return e.r; });
    if (cand.length < 3) return null;
    cand = shuffle(cand.slice());
    var years = [], seen = {};
    for (i = 0; i < BASE.length; i++){ if (!seen[BASE[i].y]){ seen[BASE[i].y] = 1; years.push(BASE[i].y); } }
    for (i = 0; i < Math.min(n, cand.length); i++){
      var ev = cand[i];
      var others = years.filter(function(y){ return y !== ev.y; });
      others.sort(function(a, b){ return Math.abs(a - ev.y) - Math.abs(b - ev.y); });
      var opts2 = shuffle(others.slice(0, 7)).slice(0, 3);
      opts2.push(ev.y);
      opts2.sort(function(a, b){ return a - b; });
      qs.push({e:ev, opts:opts2});
    }
    return qs;
  }
  return null;
}

function startGame(k){
  var m = modeOf(k);
  if (!S.prefs.dlevels.length){ renderDefisHome('Choisis au moins un niveau.'); return; }
  var qs = buildQuestions(k, poolFor(S.prefs.dlevels), m.n);
  if (!qs || !qs.length){ renderDefisHome('Pas assez d’événements pour ce défi avec ces niveaux. Ajoute un niveau.'); return; }
  GM = {k:k, m:m, qs:qs, i:0, score:0, max:(k === 'ordre' ? qs.length * 5 : qs.length), errs:[], done:false};
  renderQ();
}

function lockOpts(){ var b = $('g-opts').querySelectorAll('.opt'); for (var i = 0; i < b.length; i++) b[i].disabled = true; }
function feedback(ok, html, errText){
  if (ok === true) GM.score += 1;
  if (errText) GM.errs.push(errText);
  GM.done = true;
  lockOpts();
  var last = GM.i === GM.qs.length - 1;
  var cls = ok === true ? 'ok' : (ok === false ? 'ko' : (ok >= 0.99 ? 'ok' : 'ko'));
  var title = ok === true ? 'Bravo !' : (ok === false ? 'Pas tout à fait.' : '');
  $('g-fb').innerHTML = '<div class="fb ' + cls + '">' + (title ? '<b>' + title + '</b>' : '') + html + '</div><div class="row" style="margin-bottom:12px"><button type="button" class="btn" id="g-next">' + (last ? 'Voir mon score' : 'Question suivante') + '</button></div>';
  var nx = $('g-next');
  try { nx.focus({preventScroll:true}); } catch (e) { nx.focus(); }
  nx.scrollIntoView ? nx.scrollIntoView({block:'nearest'}) : null;
